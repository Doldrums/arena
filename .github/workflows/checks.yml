name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check_repository_policy.py
      - run: python -m pip install -e '.[dev]'
      - run: python -m arena.registry validate
      - run: python scripts/check_releases.py
      - run: python scripts/audit_framework_coverage.py --check
      - run: python scripts/build_insights.py --check
      - run: python scripts/build_search_families.py --check
      - run: python -m arena.references validate
      - run: python -m pytest -q
      - run: python -m pip wheel . --no-deps -w dist
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/web/package-lock.json
      - run: python -m pip install -e .
      - run: python scripts/build_search_families.py --check
      - run: npm ci
      - run: npm ci --prefix tests/web
      - run: npm run test:web
      - run: npm run test:api
      - run: npm run typecheck
      - run: npm run check:cloudflare
