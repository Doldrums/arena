# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Tournaments with small largest transitive subtournaments

    construct() -> 190 integer bits, one for each pair (i,j), i<j, in lexicographic order on 20 vertices. Bit 0 orients i to j and bit 1 orients j to i. Minimize the exact largest transitive induced subtournament, computed by source-vertex subset recursion. The local n=20 task minimizes the largest transitive subset rather than reproducing the larger R(7) computation. This small order is labelled rediscovery, with no new-bound claim.

    Candidate interface: construct() -> 190 integer bits, one for each pair (i,j), i<j, in lexicographic order on 20 vertices. Bit 0 orients i to j and bit 1 orients j to i. Minimize the exact largest transitive induced subtournament, computed by source-vertex subset recursion.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
