# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Hamilton cycles appearing early in an edge process

    construct() -> a permutation of vertices 0..23, describing a Hamilton cycle with implicit closing edge. Score is the largest one-based arrival index of its edges in the pinned uniformly shuffled complete-graph edge list. Minimize that prefix index. The evaluator certifies presence, not absence of all earlier Hamilton cycles. One complete-edge permutation on 24 vertices, locally shuffled with random.Random(614), replaces an asymptotic random ensemble. Each score is an upper bound on this sample’s true hitting time, not proof that it is earliest.

    Candidate interface: construct() -> a permutation of vertices 0..23, describing a Hamilton cycle with implicit closing edge. Score is the largest one-based arrival index of its edges in the pinned uniformly shuffled complete-graph edge list. Minimize that prefix index. The evaluator certifies presence, not absence of all earlier Hamilton cycles.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
