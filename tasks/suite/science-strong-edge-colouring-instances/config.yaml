# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Strong edge colourings of three fixed bounded-degree graphs

    construct() -> three lists of edge colours, one per instance from bounded_degree_graph(n, d, seed) for (40,4,101), (60,5,102), (80,6,103) in the verifier; colours follow the sorted edge order. Each colour class must be an induced matching (no two edges share a vertex or are joined by an edge). Minimize the total number of colours used; the Erdős-Nešetřil conjecture predicts at most 5d^2/4 per instance (20 + 31 + 45). The score totals colours on three fixed graphs of maximum degree 4, 5 and 6; it measures a colouring method, not the conjecture.

    Candidate interface: construct() -> three lists of edge colours, one per instance from bounded_degree_graph(n, d, seed) for (40,4,101), (60,5,102), (80,6,103) in the verifier; colours follow the sorted edge order. Each colour class must be an induced matching (no two edges share a vertex or are joined by an edge). Minimize the total number of colours used; the Erdős-Nešetřil conjecture predicts at most 5d^2/4 per instance (20 + 31 + 45).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
