# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Measured tandem-spectrum peptide reconstruction

    Decode physically mass-consistent peptide sequences from measured fragment spectra and rank confidence under exact-sequence and precision-coverage evaluation.

    Candidate interface: decode_spectrum(peaks, precursor_mass, charge) -> (unmodified_peptide, confidence0..1). precursor_mass is NEUTRAL mass in Da (not m/z). Standard residues, I/L equivalent, mass error<=50ppm. Empty sequence/confidence0 is abstention. Maximize tie-grouped stepwise precision-coverage area; exact recall diagnostic. Measured-spectrum CPU decoder track, no learned encoder required.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
