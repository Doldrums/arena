# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Empirical phylogenetic tree likelihood search

    Construct a valid evolutionary tree for an empirical DNA alignment; an independently written pruning evaluator recomputes its JC69 likelihood.

    Candidate interface: infer_tree(alignment, substitution_model, budget_seconds) -> semicolon-terminated Newick tree. Alignment maps taxon names to DNA strings. Each input taxon exactly once; finite branch lengths0..100. Independently calculate JC69 pruning likelihood; minimize mean negative log-likelihood per alignment site. Empirical likelihood is not true-topology accuracy.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
