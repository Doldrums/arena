# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Distinct subset sums with a small largest element

    construct() -> exactly n=12 distinct positive Python integers <= maximum=1048576. Every subset, including the empty subset, must have a different sum. Minimize the largest integer. Exactly 12 positive integers with bounded largest entry; all 4096 subset sums checked. An improved feasible largest entry is only a finite upper bound.

    Candidate interface: construct() -> exactly n=12 distinct positive Python integers <= maximum=1048576. Every subset, including the empty subset, must have a different sum. Minimize the largest integer.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
