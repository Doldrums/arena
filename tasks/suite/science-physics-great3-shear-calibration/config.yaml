# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    GREAT3 weak-lensing shear calibration

    estimate_shear(images, psf, metadata) -> [g1,g2] per GREAT3 subfield. Images have (galaxy,y,x) axes; PSF is a source stamp. Noise-cancellation groups remain intact. Independent evaluator rotates shear into PSF frame and computes official ground constant-shear Qc with multiplicative/additive bias diagnostics. No variable-shear claim.

    Candidate interface: estimate_shear(images, psf, metadata) -> [g1,g2] per GREAT3 subfield. Images have (galaxy,y,x) axes; PSF is a source stamp. Noise-cancellation groups remain intact. Independent evaluator rotates shear into PSF frame and computes official ground constant-shear Qc with multiplicative/additive bias diagnostics. No variable-shear claim.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
