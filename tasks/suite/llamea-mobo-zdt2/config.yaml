# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    ZDT2

    ZDT2 task evaluated in LLM-Driven Evolutionary Generation of Multi-Objective Bayesian Optimization Algorithms.

    Candidate interface: class Optimizer: __init__(self, budget, dim, n_obj); __call__(self, problem, bounds) evaluates problem(x) -> objectives (minimize all) at most budget times. Score: hypervolume of the evaluated points normalized by the known Pareto front's hypervolume

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
