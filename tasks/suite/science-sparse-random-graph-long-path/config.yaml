# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Long paths above the random-graph phase transition

    construct() -> a nonempty ordered list of distinct vertices in 0..99 forming a simple path in the pinned graph; all consecutive pairs must be edges. Maximize path vertex count. No path-closing edge is required. A locally generated G(100,1.8/100) sample, using random.Random(748), is pinned. The finite path score certifies a lower bound for this one graph, without proving a high-probability asymptotic result.

    Candidate interface: construct() -> a nonempty ordered list of distinct vertices in 0..99 forming a simple path in the pinned graph; all consecutive pairs must be edges. Maximize path vertex count. No path-closing edge is required.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
