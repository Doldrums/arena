# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Short distinct-denominator inverse sums covering residues modulo 101

    construct() -> 101 nonempty lists, row r containing distinct denominators in 1..10 whose modular inverses sum to r modulo 101. Every residue must be represented. Minimize the largest row length. Denominators may recur across different rows, but never within one row. The local p=101, denominator-bound-ten problem is a concrete finite covering certificate; it does not reproduce the all-prime, arbitrary-epsilon theorem.

    Candidate interface: construct() -> 101 nonempty lists, row r containing distinct denominators in 1..10 whose modular inverses sum to r modulo 101. Every residue must be represented. Minimize the largest row length. Denominators may recur across different rows, but never within one row.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
