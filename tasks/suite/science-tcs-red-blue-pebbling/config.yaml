# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Theoretical computer science: Communication-minimizing DAG pebbling

    Communication-minimizing DAG pebbling under a bounded candidate interface with independent verification; generated mathematical instances, no external dataset.

    Candidate interface: pebble(dag, fast_memory_budget) -> list of [operation, vertex], with operations load/store/compute/delete. dag has topologically ordered parents and output vertices. Inputs start blue, all outputs must finish blue; every red value consumes one fast-memory slot, including newly computed results. Recomputations allowed; at most20000 operations. Score mean transfers / naive schedule on three layered DAGs; exact state-machine verification.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
