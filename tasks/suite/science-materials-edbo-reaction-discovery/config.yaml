# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Budgeted EDBO+ reaction-condition discovery

    suggest(observations, candidate_conditions, batch_size) -> list of unused integer row indices. Observations have index, yield (percent), cost (released accounting); pool contains categorical base/ligand/solvent and concentration/temperature. One experiment per call, 32 calls on each of three shuffled versions of the full 1,728-experiment BMS campaign. Score: mean area under normalized two-objective hypervolume trajectory (yield maximized, cost minimized). No unqueried outcomes may be accessed.

    Candidate interface: suggest(observations, candidate_conditions, batch_size) -> list of unused integer row indices. Observations have index, yield (percent), cost (released accounting); pool contains categorical base/ligand/solvent and concentration/temperature. One experiment per call, 32 calls on each of three shuffled versions of the full 1,728-experiment BMS campaign. Score: mean area under normalized two-objective hypervolume trajectory (yield maximized, cost minimized). No unqueried outcomes may be accessed.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
