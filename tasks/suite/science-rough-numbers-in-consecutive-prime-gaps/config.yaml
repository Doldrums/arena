# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Rough integer witnesses inside consecutive prime gaps

    construct() -> a list aligned with the 32 pinned consecutive-prime pairs. Each entry is either None (no certificate) or an integer STRICTLY between its pair whose least prime factor is at least the prime gap. Supply at least one witness; maximize certified gaps. The verifier checks primality, consecutiveness and every least factor independently. None never asserts nonexistence. Thirty-two consecutive gaps beginning at 10007 are pinned. Some gaps may have no witness and a skipped gap does not prove that. This finite certificate count does not imply a universal all-gap result or the paper’s density estimate.

    Candidate interface: construct() -> a list aligned with the 32 pinned consecutive-prime pairs. Each entry is either None (no certificate) or an integer STRICTLY between its pair whose least prime factor is at least the prime gap. Supply at least one witness; maximize certified gaps. The verifier checks primality, consecutiveness and every least factor independently. None never asserts nonexistence.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
