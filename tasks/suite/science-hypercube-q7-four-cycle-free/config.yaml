# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Four-cycle-free edge sets of the 7-dimensional hypercube

    construct() -> list of edges [u, v] of Q7 (vertices 0..127, endpoints differing in one bit). No 2-dimensional face may have all four edges selected. Maximize the number of edges (Q7 has 448). An edge set with m edges certifies ex(Q7,C4) >= m; 304 is the best known and 308 the best upper bound.

    Candidate interface: construct() -> list of edges [u, v] of Q7 (vertices 0..127, endpoints differing in one bit). No 2-dimensional face may have all four edges selected. Maximize the number of edges (Q7 has 448).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
