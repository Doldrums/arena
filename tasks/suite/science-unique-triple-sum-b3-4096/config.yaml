# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large integer sets with unique triple sums

    construct() -> 1..80 distinct positive integers <=n=4096. Every unordered triple, allowing repetitions, must have a different sum. Maximize cardinality. At most 80 positive integers in [1,4096], with all unordered triples including repetitions having unique sums. This is B_3[1], not the g>=2 improvement in the cited paper.

    Candidate interface: construct() -> 1..80 distinct positive integers <=n=4096. Every unordered triple, allowing repetitions, must have a different sum. Maximize cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
