# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    TDLMC time-delay distance posterior

    infer_distance(image, psf, time_delays, kinematics, metadata) -> 32..4096 joint physical posterior samples; first column time-delay distance Mpc, others named bounded lens/source nuisances. Metadata includes evaluator-owned lenstronomy forward callable and budget. TDLMC Rungs 1 or 2 whole systems only. Relative distance CRPS plus independent image/delay/dynamical forward-likelihood penalty; bias, interval width and coverage reported.

    Candidate interface: infer_distance(image, psf, time_delays, kinematics, metadata) -> 32..4096 joint physical posterior samples; first column time-delay distance Mpc, others named bounded lens/source nuisances. Metadata includes evaluator-owned lenstronomy forward callable and budget. TDLMC Rungs 1 or 2 whole systems only. Relative distance CRPS plus independent image/delay/dynamical forward-likelihood penalty; bias, interval width and coverage reported.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
