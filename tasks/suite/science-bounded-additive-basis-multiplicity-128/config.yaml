# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Additive bases with few representations

    construct() -> a nonempty subset A of [0,n=128]. Every integer in [128,256] must be a sum of two elements of A. Pair representations are unordered and permit equal summands. Minimize the largest representation multiplicity in that target interval. Choose A in [0,128] covering [128,256] by pair sums and minimize peak multiplicity. Local pairs are unordered and include equal summands; the paper’s ordered convention differs by symmetry.

    Candidate interface: construct() -> a nonempty subset A of [0,n=128]. Every integer in [128,256] must be a sum of two elements of A. Pair representations are unordered and permit equal summands. Minimize the largest representation multiplicity in that target interval.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
