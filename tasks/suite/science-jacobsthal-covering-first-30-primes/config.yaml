# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Covering an initial interval with one residue class for each of the first 30 primes

    construct() -> 30 residues r_1, ..., r_30 with 0 <= r_i < p_i for the first 30 primes 2, 3, ..., 113. The score is the largest L such that every integer 1..L is congruent to r_i modulo p_i for some i. Maximize; the optimum is 329 (Jacobsthal's function of the product of the first 30 primes is 330). For the first 30 primes the optimum is 329, so the task recovers an extremal covering.

    Candidate interface: construct() -> 30 residues r_1, ..., r_30 with 0 <= r_i < p_i for the first 30 primes 2, 3, ..., 113. The score is the largest L such that every integer 1..L is congruent to r_i modulo p_i for some i. Maximize; the optimum is 329 (Jacobsthal's function of the product of the first 30 primes is 330).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
