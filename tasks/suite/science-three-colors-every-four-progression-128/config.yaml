# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Colorings with three colors in every four-term progression

    construct() -> n=128 integer color labels in 0..127. Every nonconstant four-term progression of positions must use AT LEAST three distinct colors. Minimize the number of labels actually used; labels need not be consecutive. Minimize colors on [1,128] with at least three colors on every four-term progression. The source’s largest forcing-color threshold is one below the least avoiding-color count; local score uses the latter convention.

    Candidate interface: construct() -> n=128 integer color labels in 0..127. Every nonconstant four-term progression of positions must use AT LEAST three distinct colors. Minimize the number of labels actually used; labels need not be consecutive.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
