# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large integer sets with no two-other-product divisibility

    construct() -> nonempty distinct integers in 2..256. For every THREE DISTINCT members a,b,c, require that a does not divide b*c. Maximize cardinality. In particular b and c cannot denote the same member; this convention is part of the finite contract. Only the interval up to 256 is searched. The verifier uses three distinct members, and it does not claim a sharp asymptotic error term or optimal cardinality.

    Candidate interface: construct() -> nonempty distinct integers in 2..256. For every THREE DISTINCT members a,b,c, require that a does not divide b*c. Maximize cardinality. In particular b and c cannot denote the same member; this convention is part of the finite contract.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
