# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Long coprimality gaps for five-prime moduli

    construct() -> a squarefree integer n in [2,1000000] with exactly five distinct prime factors. Maximize the longest cyclic run of residues not coprime to n. This score equals j(n)-1, not j(n); every residue and the wraparound gap are checked. The bounded five-factor search recovers a known finite case; Table 1 gives H(5)=14, so the local run-length score has a known upper bound of 13.

    Candidate interface: construct() -> a squarefree integer n in [2,1000000] with exactly five distinct prime factors. Maximize the longest cyclic run of residues not coprime to n. This score equals j(n)-1, not j(n); every residue and the wraparound gap are checked.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
