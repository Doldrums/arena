# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Two-colourings avoiding a red 3-term and a blue 12-term progression (w(3,12) = 135)

    construct() -> colours c_1, ..., c_N in {0, 1} with 1 <= N <= 135. Colour 0 may contain no 3-term and colour 1 no 12-term arithmetic progression (exhaustive check). Maximize N; the optimum is 134 because w(3,12) = 135. Since w(3,12) = 135, the longest valid colouring has 134 terms; the task recovers an extremal colouring.

    Candidate interface: construct() -> colours c_1, ..., c_N in {0, 1} with 1 <= N <= 135. Colour 0 may contain no 3-term and colour 1 no 12-term arithmetic progression (exhaustive check). Maximize N; the optimum is 134 because w(3,12) = 135.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
