# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Which small gaps occur between consecutive integers coprime to 29#

    construct() -> up to 200 certificates [x, g] with 1 <= x <= 29# = 6469693230 and 2 <= g <= 1000, where x and x + g are coprime to 29# and every integer strictly between them shares a prime factor with 29#. The score is the largest L such that each even gap 2, 4, ..., L is certified. Maximize; the optimum is 46 (the gap 48 does not occur). For 29# every even gap up to 46 occurs and 48 does not, so the optimum is 46.

    Candidate interface: construct() -> up to 200 certificates [x, g] with 1 <= x <= 29# = 6469693230 and 2 <= g <= 1000, where x and x + g are coprime to 29# and every integer strictly between them shares a prime factor with 29#. The score is the largest L such that each even gap 2, 4, ..., L is certified. Maximize; the optimum is 46 (the gap 48 does not occur).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
