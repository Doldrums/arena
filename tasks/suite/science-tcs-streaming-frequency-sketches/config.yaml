# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Theoretical computer science: Memory-bounded streaming frequency sketches

    Memory-bounded streaming frequency sketches under a bounded candidate interface with independent verification; generated mathematical instances, no external dataset.

    Candidate interface: update(state: bytes, item: int) -> bytes; query(state: bytes, item: int) -> nonnegative frequency estimate. Initial state is1024 zero bytes; persistent state<=1024bytes. Fresh Python interpreter per256-item chunk, only state persists. Three1024-item insertion-only streams, universe400. Minimize mean absolute count error / stream length; top10recall diagnostic.15s perchunk,120s overall. Cooperative memory contract, not malicious-code sandbox.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
