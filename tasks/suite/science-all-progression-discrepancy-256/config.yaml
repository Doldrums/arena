# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Low discrepancy on all arithmetic progressions

    construct() -> exactly n=256 Python integer signs -1 or +1. Minimize the maximum absolute signed sum on ANY arithmetic progression contained in [1,256], any start, positive step and length including one. Assign 256 signs and minimize the maximum absolute sum on any arithmetic progression, including arbitrary starts and singletons. This differs from homogeneous-progression Erdős discrepancy.

    Candidate interface: construct() -> exactly n=256 Python integer signs -1 or +1. Minimize the maximum absolute signed sum on ANY arithmetic progression contained in [1,256], any start, positive step and length including one.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
