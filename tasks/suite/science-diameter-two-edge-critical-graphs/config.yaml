# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Dense graphs with every edge essential for diameter two

    construct() -> simple undirected edges on vertices 0..15. The graph must have diameter exactly two. Deleting EACH individual edge must increase its diameter above two or disconnect it. Maximize edge count; the evaluator repeats exact all-pairs BFS for every edge deletion. Only sixteen vertices are searched; finite candidates provide lower constructions, not upper-bound proofs for every order. The star seed is an elementary complete bipartite example. No novelty or unresolved status of this small order is asserted.

    Candidate interface: construct() -> simple undirected edges on vertices 0..15. The graph must have diameter exactly two. Deleting EACH individual edge must increase its diameter above two or disconnect it. Maximize edge count; the evaluator repeats exact all-pairs BFS for every edge deletion.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
