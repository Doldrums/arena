# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Climate dynamics: unresolved-tendency closure

    Fit a shared degree-five polynomial approximation to the unresolved fast-scale forcing of a two-scale Lorenz-96 model. Train on supplied slow-state/tendency pairs and minimize normalized error on independent validation trajectories, including an unseen forcing regime.

    Candidate interface: construct(training_x, training_subgrid_tendency) -> 6 finite real polynomial coefficients in ASCENDING powers of local slow state x, approximating the unresolved tendency as sum(c_i*x**i). Inputs are flattened paired samples from two independent spun-up trajectories at F=6,8. Reference uses Rasp (2020) two-scale Lorenz-96 with K=8,J=4,h=1,c=10,b=10: dX=advection-X+F-h*c*mean(Y); dY=c*(-b*Y_(j+1)*(Y_(j+2)-Y_(j-1))-Y+h*X/J). Fast indices form one periodic K*J ring, crossing slow-cell boundaries. Score is mean validation MSE/variance(true tendency) over three independent trajectories at F=6,8,10. Units nondimensional. Coefficients must be a single shared polynomial for every cell and forcing.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
