# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Clique partitions of three fixed split (chordal) graphs

    construct() -> three lists of cliques (vertex lists), one per instance from split_graph(n, k, p, seed) for (30,10,0.7,301), (60,20,0.7,302), (90,30,0.7,303) in the verifier: a clique on the first k vertices, an independent set on the rest and each cross pair joined with probability p (split graphs are chordal). Every listed set must be a clique with at least two vertices and every edge must lie in exactly one listed clique. Minimize the total number of cliques; the Erdős-Ordman-Zalcstein question asks whether n^2/6 + O(n) always suffice, and split graphs need at most 3n^2/16 + O(n). The score totals clique partition sizes on three fixed random split graphs; it measures a partitioning method.

    Candidate interface: construct() -> three lists of cliques (vertex lists), one per instance from split_graph(n, k, p, seed) for (30,10,0.7,301), (60,20,0.7,302), (90,30,0.7,303) in the verifier: a clique on the first k vertices, an independent set on the rest and each cross pair joined with probability p (split graphs are chordal). Every listed set must be a clique with at least two vertices and every edge must lie in exactly one listed clique. Minimize the total number of cliques; the Erdős-Ordman-Zalcstein question asks whether n^2/6 + O(n) always suffice, and split graphs need at most 3n^2/16 + O(n).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
