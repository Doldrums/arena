# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Triangle-free graphs on 23 vertices that are far from bipartite

    construct() -> list of edges [u, v] of a simple triangle-free graph on vertices 0..22. The score is the least number of edges whose deletion leaves a bipartite graph, computed exactly as edges minus the maximum cut over all 2^22 bipartitions. Maximize; the known optimum is 20. The finite maximum over triangle-free graphs on 23 vertices is 20 (below the conjectured bound 21.16); recovering it tests constructions near the extremal C5 blow-ups.

    Candidate interface: construct() -> list of edges [u, v] of a simple triangle-free graph on vertices 0..22. The score is the least number of edges whose deletion leaves a bipartite graph, computed exactly as edges minus the maximum cut over all 2^22 bipartitions. Maximize; the known optimum is 20.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
