# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Lennard-Jones cluster global minimum, 38 atoms

    Place 38 atoms interacting through the Lennard-Jones potential (reduced units) to minimise the total energy. LJ38 is the classic hard case of cluster optimisation: the global minimum is a face-centred-cubic truncated octahedron (energy -173.928427, Cambridge Cluster Database) while the icosahedral funnel traps local searches. The evaluator computes the energy exactly; the seed is a cubic lattice fragment.

    Candidate interface: construct() -> array of shape (N, 3): Cartesian coordinates of N atoms in reduced Lennard-Jones units (sigma = 1). Atoms must be at least 0.5 apart. Score: total Lennard-Jones energy 4*sum(r^-12 - r^-6) over all pairs, minimized. science_chemistry.relax(positions) (L-BFGS local relaxation) is available to candidates.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
