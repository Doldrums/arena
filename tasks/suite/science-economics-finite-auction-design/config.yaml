# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Economics: Incentive-compatible finite auction design

    Incentive-compatible finite auction design with an explicit candidate API, independently recomputed objective and fixed model/data assumptions.

    Candidate interface: construct_auction(distribution_spec, support, constraints) -> {allocations:(16,2),payments:(16,)}. One additive bidder,two goods,each value in{0,1,2,3},three fixed distributions. Every allowed report is enumerated; require feasible probabilities, nonnegative payments, individual rationality and regret<=1e-8. Maximize expected revenue normalized by an independently solved finite-support mechanism LP. Truthfulness holds only on the declared report/value support.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
