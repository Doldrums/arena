# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Many three-term progressions without four-term progressions

    construct() -> a nonempty subset of [1,n=256], with no nonconstant four-term arithmetic progression. Maximize the number of distinct three-term arithmetic progressions (positive difference, counted once). Cardinality and ambient interval are both reported; finite-box restriction of the source extremal problem. Choose a subset of [1,256] with no four-term progression and maximize the number of three-term progressions. Unlike the paper, ambient height is fixed and cardinality varies; each result bounds f_{3,4}(|A|) from below.

    Candidate interface: construct() -> a nonempty subset of [1,n=256], with no nonconstant four-term arithmetic progression. Maximize the number of distinct three-term arithmetic progressions (positive difference, counted once). Cardinality and ambient interval are both reported; finite-box restriction of the source extremal problem.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
