# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    FSNet Nonsmooth nonconvex SOCP

    FSNet Nonsmooth nonconvex SOCP

    Candidate interface: solve(problem, time_limit) -> x: a length-problem['n'] vector for the instance dict (kind, form in {qp, qcqp, socp, lp, milp}, arrays Q, p, A, b, G, h, lb, ub, and H/g/r, cones, c, A_ub, b_ub, A_eq, b_eq, integer as applicable; nonconvex instances add sum(sin(x)), nonsmooth ones add 0.5*||x||_1 to the objective). l2o.objective(problem, x), l2o.violation(problem, x) and l2o.scipy_constraints(problem) are available. Score: mean over five seeded instances of the relative optimality gap against an independent reference (Clarabel / HiGHS / multistart SLSQP); infeasible (violation > 1e-4), non-finite or over-time solutions count as gap 1. Lower is better.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
