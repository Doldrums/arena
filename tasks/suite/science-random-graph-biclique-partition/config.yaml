# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Small exact biclique partitions of a random graph

    construct() -> list of bicliques, each [left_vertices,right_vertices] with nonempty disjoint sides. Every cross pair must be a host edge. The cross-edge sets must partition all pinned graph edges exactly once. Within-side edges are allowed. Minimize number of bicliques. One local G(30,1/2) sample (random.Random(664)) is pinned. The star baseline is independently encoded; scores are partition upper bounds on this finite sample, not typical asymptotic minima.

    Candidate interface: construct() -> list of bicliques, each [left_vertices,right_vertices] with nonempty disjoint sides. Every cross pair must be a host edge. The cross-edge sets must partition all pinned graph edges exactly once. Within-side edges are allowed. Minimize number of bicliques.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
