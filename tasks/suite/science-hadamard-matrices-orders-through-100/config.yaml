# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Hadamard matrix constructions through order 100

    construct() -> 25 rows for orders 4,8,...,100. A row is None or an n-by-n matrix of Python integer signs -1/+1 satisfying H*H^T=n*I. Maximize the fraction of orders constructed. Every row product is checked exactly. These small orders have known solutions; this is a rediscovery task. Construct sign matrices for orders 4,8,...,100, maximizing order coverage. These orders already have constructions; no SageMath code or matrix data is copied.

    Candidate interface: construct() -> 25 rows for orders 4,8,...,100. A row is None or an n-by-n matrix of Python integer signs -1/+1 satisfying H*H^T=n*I. Maximize the fraction of orders constructed. Every row product is checked exactly. These small orders have known solutions; this is a rediscovery task.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
