# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large powerful-part product for consecutive integers

    Return an integer n in [10000,1000000]. Its powerful part is the product of FULL prime powers p^e with exponent e>=2 in its factorization. Maximize powerful_part(n)*powerful_part(n+1). The B2 powerful-part construction allows squarefree factors and does not require either whole integer to be powerful or nonsquare; distinct from the existing Golomb counterexample certificate.

    Candidate interface: construct() -> candidate. Return an integer n in [10000,1000000]. Its powerful part is the product of FULL prime powers p^e with exponent e>=2 in its factorization. Maximize powerful_part(n)*powerful_part(n+1).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
