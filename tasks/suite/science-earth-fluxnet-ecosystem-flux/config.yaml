# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth and environment: Measured ecosystem carbon-flux reconstruction

    Predict half-hourly net ecosystem carbon exchange from meteorology and ecosystem metadata, scoring quality-controlled measured targets rather than gap-filled products.

    Candidate interface: fit_flux(training_sites) -> model.predict_flux(meteorology,ecosystem_metadata,history). Half-hourly FLUXNET columns[air_temperature_C,shortwave_Wm2,...]; net ecosystem CO2 exchange target in source units, can be negative. Only targetQC0 measured points score; no gap-filled values. Minimize site-macro RMSE divided by training-target standard deviation; complete sites/year blocks held out.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
