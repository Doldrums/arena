# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    High two-adic valuation of factorial sums containing 2!

    Return a distinct subset of factorial indices [2,32] containing 2. Maximize v2(sum(i!)); the smallest index is FIXED at 2 to match the source question f(a1,p). Fixes the smallest factorial index as required by the original valuation question. The seed is a local greedy algorithm; any known numerical identity it rediscovers is not a novel result.

    Candidate interface: construct() -> candidate. Return a distinct subset of factorial indices [2,32] containing 2. Maximize v2(sum(i!)); the smallest index is FIXED at 2 to match the source question f(a1,p).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
