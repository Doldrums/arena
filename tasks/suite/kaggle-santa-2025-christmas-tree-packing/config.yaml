# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Santa 2025: Christmas tree packing (n = 1..200)

    For every n from 1 to 200 place n copies of the competition's fixed 15-vertex tree polygon (rotations allowed, no overlaps, coordinates within [-100, 100]) so that the bounding square of each configuration is as small as possible; the score is the sum over n of (bounding-square area / n), lower is better.

    Candidate interface: construct(n) -> array of shape (n, 3): rows (x, y, deg) placing n copies of the fixed Christmas-tree polygon without overlap (deg rotates about the tree origin, x and y within [-100, 100]); called once for every n from n_min to n_max

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
