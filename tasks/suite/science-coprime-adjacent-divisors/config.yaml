# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Integers up to 10^18 with many coprime adjacent divisors

    construct() -> an integer n with 2 <= n <= 10^18. With the divisors of n in increasing order (exact factorization), the score tau_perp(n) is the number of adjacent pairs d_i < d_{i+1} with gcd 1. Maximize. Large values below 10^18 are finite lower-bound constructions for the maximal order of tau_perp.

    Candidate interface: construct() -> an integer n with 2 <= n <= 10^18. With the divisors of n in increasing order (exact factorization), the score tau_perp(n) is the number of adjacent pairs d_i < d_{i+1} with gcd 1. Maximize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
