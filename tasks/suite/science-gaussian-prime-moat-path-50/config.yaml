# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Gaussian-prime paths with small maximum jumps

    construct() -> a list of distinct integer coordinate pairs in [-64,64]^2, starting at (1,1), ending with max(abs(x),abs(y))>=50, and containing only Gaussian primes. Minimize the largest squared Euclidean step. Axis primes must be 3 modulo 4; off-axis norms must be prime. The finite path minimizes its largest jump inside a bounded square; it does not establish an infinite path or reproduce the periodic-moat proof. The optimum is 8, found by breadth-first search over all Gaussian primes in the box; this is a rediscovery task.

    Candidate interface: construct() -> a list of distinct integer coordinate pairs in [-64,64]^2, starting at (1,1), ending with max(abs(x),abs(y))>=50, and containing only Gaussian primes. Minimize the largest squared Euclidean step. Axis primes must be 3 modulo 4; off-axis norms must be prime.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
