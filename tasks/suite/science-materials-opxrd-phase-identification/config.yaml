# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    opXRD experimental phase identification

    identify_phases(two_theta_degrees, intensity, wavelength_angstrom, candidate_library) -> unique phase identifiers. Eight measured HKUST-A opXRD evaluation scans, including real2/3/4-phase mixtures;13 development scans use disjoint connected compound groups. The fixed25-phase library supplies source refined lattices and atomic bases, never held-out measured intensities. Score macro F1 of all source-reported curated phase labels. Annotation exhaustiveness and unreported impurities are unknown; no phase-fraction metric. Single-contributor study, no cross-laboratory claim. Seed computes approximate kinematic structural templates; observations are always actual source scans.

    Candidate interface: identify_phases(two_theta_degrees, intensity, wavelength_angstrom, candidate_library) -> unique phase identifiers. Eight measured HKUST-A opXRD evaluation scans, including real2/3/4-phase mixtures;13 development scans use disjoint connected compound groups. The fixed25-phase library supplies source refined lattices and atomic bases, never held-out measured intensities. Score macro F1 of all source-reported curated phase labels. Annotation exhaustiveness and unreported impurities are unknown; no phase-fraction metric. Single-contributor study, no cross-laboratory claim. Seed computes approximate kinematic structural templates; observations are always actual source scans.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
