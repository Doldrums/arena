# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    No element dividing a sum of three others

    construct() -> 1..maximum=48 distinct positive integers <=n=192. No selected integer may divide the sum of any k=3 DISTINCT OTHER selected integers. Maximize cardinality. This excludes the tested element from the summands. Follow the prize bank’s prescribed-number wording: k=3 distinct OTHER summands in [1,192], at most 48 elements. This relaxes the broader all-subsets condition in Erdős’s survey and is not attributed as his exact original statement.

    Candidate interface: construct() -> 1..maximum=48 distinct positive integers <=n=192. No selected integer may divide the sum of any k=3 DISTINCT OTHER selected integers. Maximize cardinality. This excludes the tested element from the summands.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
