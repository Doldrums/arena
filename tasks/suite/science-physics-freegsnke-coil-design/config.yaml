# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    FreeGSNKE tokamak coil design

    design_coils(machine, target_boundary, plasma_profile) -> eight bounded active-coil currents in A for the published Anamak geometry. Evaluator runs pinned FreeGSNKE static equilibrium at two grid resolutions, checks nonlinear Grad-Shafranov residual, closed-plasma topology and current bounds, then scores boundary/axis mismatch. Targets/profile cases generated from the specified source model and saved with numerical reference checks. No physical reactor claim.

    Candidate interface: design_coils(machine, target_boundary, plasma_profile) -> eight bounded active-coil currents in A for the published Anamak geometry. Evaluator runs pinned FreeGSNKE static equilibrium at two grid resolutions, checks nonlinear Grad-Shafranov residual, closed-plasma topology and current bounds, then scores boundary/axis mismatch. Targets/profile cases generated from the specified source model and saved with numerical reference checks. No physical reactor claim.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
