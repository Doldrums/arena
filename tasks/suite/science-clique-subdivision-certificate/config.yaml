# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large clique subdivisions in a pinned graph

    construct() -> {'branches': distinct vertices, 'paths': one simple path for each unordered pair of branches}. Path endpoints must be their branch pair; all path interiors must be pairwise disjoint and avoid every branch. All consecutive path vertices must be adjacent in the pinned graph. Maximize number of branch vertices. A local G(24,0.4) sample (random.Random(585)) is pinned. A certificate is a lower bound on this host’s largest subdivision order; no theorem about all chromatic graphs or reproduction of the paper’s proof is claimed.

    Candidate interface: construct() -> {'branches': distinct vertices, 'paths': one simple path for each unordered pair of branches}. Path endpoints must be their branch pair; all path interiors must be pairwise disjoint and avoid every branch. All consecutive path vertices must be adjacent in the pinned graph. Maximize number of branch vertices.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
