# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    SPICE label-efficient molecular potentials

    acquire(unlabeled_geometries, observations, budget)->unused indices; fit(observations)->object with potential(atomic_numbers, coordinates_angstrom)->(energy_ev, forces_ev_angstrom). Eight precomputed quantum-label queries from12 source acquisition geometries in the bounded pilot;14 evaluation geometries hold out entire ligand groups. Score force RMSE/(1 eV/Angstrom) + molecule-centered relative-energy RMSE/(1 eV) on source-group holdouts. Independent finite differences check force/energy consistency, rigid-motion symmetries, net force/torque; short evaluator-controlled trajectories check numerical stability. All units are explicit and a test fixture never substitutes for SPICE.

    Candidate interface: acquire(unlabeled_geometries, observations, budget)->unused indices; fit(observations)->object with potential(atomic_numbers, coordinates_angstrom)->(energy_ev, forces_ev_angstrom). Eight precomputed quantum-label queries from12 source acquisition geometries in the bounded pilot;14 evaluation geometries hold out entire ligand groups. Score force RMSE/(1 eV/Angstrom) + molecule-centered relative-energy RMSE/(1 eV) on source-group holdouts. Independent finite differences check force/energy consistency, rigid-motion symmetries, net force/torque; short evaluator-controlled trajectories check numerical stability. All units are explicit and a test fixture never substitutes for SPICE.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
