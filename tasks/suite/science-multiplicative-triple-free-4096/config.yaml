# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large sets avoiding x, 2x, 3x

    construct() -> a nonempty subset of [1,n=4096] containing no triple {x,2x,3x}. Maximize cardinality; density is recorded as an exact fraction. Maximize the size of a subset of [1,4096] avoiding {x,2x,3x}. This yields a finite construction, not the exact limiting density or its irrationality. The optimum is 3281, computed exactly on the independent 3-smooth grids (OEIS A157282); this is a rediscovery task.

    Candidate interface: construct() -> a nonempty subset of [1,n=4096] containing no triple {x,2x,3x}. Maximize cardinality; density is recorded as an exact fraction.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
