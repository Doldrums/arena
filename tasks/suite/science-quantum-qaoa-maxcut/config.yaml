# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Quantum information: fixed-depth QAOA parameter design

    Design graph-dependent two-layer QAOA angles maximizing the mean ratio of the independently simulated expected cut to the exact classical optimum on six small graphs. The circuit architecture is fixed; the candidate controls its parameter-selection algorithm.

    Candidate interface: angles(n, edges, p) -> real array (p, 2), rows (gamma, beta) in radians. The fixed circuit starts in |+>^n and applies exp(-i gamma C), then exp(-i beta sum X), for each row; C is unweighted MaxCut. Return angles only. Six public evaluation graphs use n=6,8,10 and densities 0.25,0.55 (seed 713); use graph_cases(seed=113) for separate development graphs. Objective: mean expected-cut/exhaustive-optimum ratio. p=2; no shot noise or timing term.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
