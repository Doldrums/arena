# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Two-colourings of [1,256] with few monochromatic four-term progressions

    construct() -> 256 colours in {0,1} for the integers 1..256. Minimize the exact number of monochromatic 4-term arithmetic progressions a, a+d, a+2d, a+3d with d >= 1 inside 1..256. The finite count for n = 256 and k = 4 upper-bounds the minimum for this n; no exact finite value is documented.

    Candidate interface: construct() -> 256 colours in {0,1} for the integers 1..256. Minimize the exact number of monochromatic 4-term arithmetic progressions a, a+d, a+2d, a+3d with d >= 1 inside 1..256.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
