# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: ProteinGym measured protein variant effects

    Fit a mutation-effect model from measured support substitutions and predict complete held-out mutation positions in three ProteinGym assays.

    Candidate interface: fit(reference_sequence, support_variants, support_effects) -> model with score(query_variants) returning one finite value per query. Variants use ProteinGym colon-separated substitutions. Score is equal-assay mean Spearman; frozen complete-position holdout, constant predictions score 0. Query labels never passed to candidate.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
