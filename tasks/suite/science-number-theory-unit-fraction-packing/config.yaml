# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Closest strict underpacking of one by supplied unit fractions

    Return nonempty distinct zero-based indices into denominators [2,3,...,48]; reciprocal sum must be STRICTLY BELOW 1. Minimize positive deficit 1-sum; exact rational value is reported. Fixed finite input collection whose reciprocal total exceeds one; minimizes the strict deficit rather than asserting a uniform bound for all collections. The source permits an exact-one subsum; the local protocol explicitly excludes it.

    Candidate interface: construct() -> candidate. Return nonempty distinct zero-based indices into denominators [2,3,...,48]; reciprocal sum must be STRICTLY BELOW 1. Minimize positive deficit 1-sum; exact rational value is reported.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
