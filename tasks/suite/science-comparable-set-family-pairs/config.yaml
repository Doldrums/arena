# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Many comparable pairs in a fixed-size set family

    construct() -> exactly forty distinct subsets of vertices 0..11, each as a list of distinct integers; the empty set is allowed. Maximize the number of unordered pairs in which one member is a strict subset of the other. The local parameters are n=12 and m=40. This is a finite lower-bound construction for c(12,40); the baseline consists of the first forty binary masks and does not copy the paper’s extremal constructions.

    Candidate interface: construct() -> exactly forty distinct subsets of vertices 0..11, each as a list of distinct integers; the empty set is allowed. Maximize the number of unordered pairs in which one member is a strict subset of the other.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
