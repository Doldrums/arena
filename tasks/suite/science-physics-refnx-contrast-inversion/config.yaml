# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    refnx contrast reflectometry inversion

    infer_profile(training_contrasts, bounds, metadata) -> 32..4096 posterior rows [oxide thickness A, film thickness A, dry film SLD 1e-6/A^2, solvent fraction, roughness A, background]. Independent Parratt recursion with Nevot-Croce roughness and Gaussian Q-resolution predicts the wholly held-out contrast. Score posterior predictive normalized residual plus simulation-track CRPS. Source experimental contrasts are one physical sample, no cross-sample generalization claim.

    Candidate interface: infer_profile(training_contrasts, bounds, metadata) -> 32..4096 posterior rows [oxide thickness A, film thickness A, dry film SLD 1e-6/A^2, solvent fraction, roughness A, background]. Independent Parratt recursion with Nevot-Croce roughness and Gaussian Q-resolution predicts the wholly held-out contrast. Score posterior predictive normalized residual plus simulation-track CRPS. Source experimental contrasts are one physical sample, no cross-sample generalization claim.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
