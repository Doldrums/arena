# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Covering an initial interval twice with one residue class per prime up to 1000

    construct() -> 168 residues, one for each prime p <= 1000 in increasing order, with 0 <= r_p < p. The score is the largest L such that every integer 1..L satisfies at least two of the congruences x = r_p (mod p) (exact count, capped at 10^5). Maximize; L >= 1000 would realize the property asked in Erdős Problem #689 at n = 1000. Scores are doubly covered lengths for n = 1000; reaching 1000 would exhibit the property at this size.

    Candidate interface: construct() -> 168 residues, one for each prime p <= 1000 in increasing order, with 0 <= r_p < p. The score is the largest L such that every integer 1..L satisfies at least two of the congruences x = r_p (mod p) (exact count, capped at 10^5). Maximize; L >= 1000 would realize the property asked in Erdős Problem #689 at n = 1000.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
