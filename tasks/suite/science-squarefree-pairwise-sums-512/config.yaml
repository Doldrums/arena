# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Large subsets of {1, ..., 512} whose pairwise sums are all squarefree

    construct() -> distinct integers in 1..512 such that every sum a + b with a <= b (including 2a) is squarefree. Maximize the size; the optimum is 24. For N = 512 the maximum is 24, so the task recovers an extremal set. The bank entry is the infinite question (#1103); this is its finite analogue (#1109).

    Candidate interface: construct() -> distinct integers in 1..512 such that every sum a + b with a <= b (including 2a) is squarefree. Maximize the size; the optimum is 24.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
