# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth and environment: OpenFWI subsurface seismic inversion

    Reconstruct a positive subsurface velocity field from simulated seismic traces, independently checking velocity structure and a pinned source-matching wave forward model.

    Candidate interface: invert_seismograms(traces,source_receiver_geometry,forward_oracle,budget) -> positive velocity grid in m/s. geometry includes grid_shape and velocity_bounds. Independent source-matching trusted forward solver is checksum-pinned. Enforce oracle-call limit, velocity bounds; primary velocity NRMSE, gradient and forward-waveform diagnostics. Requires actual OpenFWI arrays/geometry/simulator; no toy PDE fallback.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
