# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Short intervals supplying a square-product extension

    construct() -> 1..100 distinct integers strictly larger than 210 and at most 10210. Their product multiplied by 210 must be a perfect square. Minimize max(selected integers)-210. An arbitrary-precision integer square root verifies the exact condition. The task fixes n=210, a nonsquare, and bounds the certificate and following window. A certificate gives an upper bound on t_210; exact optimality and the distribution over n are not established.

    Candidate interface: construct() -> 1..100 distinct integers strictly larger than 210 and at most 10210. Their product multiplied by 210 must be a perfect square. Minimize max(selected integers)-210. An arbitrary-precision integer square root verifies the exact condition.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
