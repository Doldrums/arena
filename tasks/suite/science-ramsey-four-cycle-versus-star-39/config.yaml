# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Four-cycle-free graphs of large minimum degree (Ramsey number R(C4,K1,39))

    construct() -> {'n': n, 'edges': [[u, v], ...]}: a simple graph on vertices 0..n-1 with 1 <= n <= 47, containing no C4, whose minimum degree is at least n - 39 (so the complement has no K1,39). Maximize n. A C4-free graph on n vertices with minimum degree at least n-39 certifies R(C4,K1,39) > n. The value is known to be 46 or 47, so 46 vertices would settle it.

    Candidate interface: construct() -> {'n': n, 'edges': [[u, v], ...]}: a simple graph on vertices 0..n-1 with 1 <= n <= 47, containing no C4, whose minimum degree is at least n - 39 (so the complement has no K1,39). Maximize n.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
