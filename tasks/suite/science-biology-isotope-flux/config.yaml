# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Isotope-constrained metabolic flux inference

    Infer steady-state reaction fluxes and uncertainty intervals from isotope measurements using a verified source-specific atom-mapping forward model.

    Candidate interface: infer_fluxes(network, atom_maps, training_measurements, training_objective, budget) -> {fluxes,intervals}. network includes stoichiometry, bounds, feasible_initial_fluxes. Enforce S@v tolerance1e-6 and flux bounds. Trusted source-specific isotope simulator produces held-out Gaussian NLL. intervals nflux x2 must contain estimates. Forward-model source/hash required; no synthetic fallback.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
