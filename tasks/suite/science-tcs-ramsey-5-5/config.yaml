# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Ramsey graphs for R(5,5): large graphs with no K5 and no independent 5-set

    Construct a graph on as many vertices as possible with no clique of size 5 and no independent set of size 5. Every such graph on n vertices proves R(5,5) > n. The best known construction is Exoo's 42-vertex graph (R(5,5) >= 43) and Angeltveit and McKay proved R(5,5) <= 46, so the exact value is open. The seed is the Paley graph on 37 vertices, verified (5,5)-free by the evaluator.

    Candidate interface: construct() -> (n, edges): the number of vertices and a list of (i, j) pairs with 0 <= i < j < n. The graph must contain no clique of size CLIQUE and no independent set of size INDEPENDENT; n must be at most MAX_VERTICES. Score: n, maximized (each valid graph proves R(CLIQUE, INDEPENDENT) > n).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
