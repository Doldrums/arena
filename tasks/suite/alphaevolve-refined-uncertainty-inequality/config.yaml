# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Refined uncertainty inequality

    Tune the refined Cohn-Goncalves Laguerre-polynomial construction for the Fourier sign uncertainty upper bound. The notebook supplies 12 double roots with m=12 and dimension n=1, verifies the root constraints, and computes the last sign change.

    Candidate interface: construct() -> list of 12 positive double-root locations for the Laguerre combination (m=12, n=1); score is the upper bound on C4

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
