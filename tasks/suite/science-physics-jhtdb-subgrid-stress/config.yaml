# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    JHTDB turbulent subgrid stress

    closure(filtered_velocity, gradients, filter_width) -> N x N x N x 3 x 3 symmetric subgrid stress. Complete periodic source DNS boxes (not wrapped cutouts) supply independent box-filtered ground truth. Whole space-time blocks split. Score stress and energy-transfer errors plus Fourier energy error after evaluator RK2 coarse rollout. Galilean and cyclic rotational consistency and rollout stability required.

    Candidate interface: closure(filtered_velocity, gradients, filter_width) -> N x N x N x 3 x 3 symmetric subgrid stress. Complete periodic source DNS boxes (not wrapped cutouts) supply independent box-filtered ground truth. Whole space-time blocks split. Score stress and energy-transfer errors plus Fourier energy error after evaluator RK2 coarse rollout. Galilean and cyclic rotational consistency and rollout stability required.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
