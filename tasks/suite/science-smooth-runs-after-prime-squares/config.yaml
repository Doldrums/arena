# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Long runs after p^2 with no prime factor exceeding p (p <= 10^9)

    construct() -> {'p': p, 'k': k} with p a prime at most 10^9 and 1 <= k <= 200; every integer p^2 + 1, ..., p^2 + k must have all prime factors at most p (exact factorization by trial division and Pollard-Brent with deterministic Miller-Rabin). Maximize k. Long runs for p <= 10^9 are finite evidence for the conjectured positive answer.

    Candidate interface: construct() -> {'p': p, 'k': k} with p a prime at most 10^9 and 1 <= k <= 200; every integer p^2 + 1, ..., p^2 + k must have all prime factors at most p (exact factorization by trial division and Pollard-Brent with deterministic Miller-Rabin). Maximize k.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
