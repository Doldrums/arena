# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Earth science: Measured wildfire spread laws

    Measured wildfire spread laws with an explicit candidate interface, physical units, independent evaluator and source-traceable observations or numerical model.

    Candidate interface: fit_spread(training_features, training_rates, metadata) -> object.spread_rate(features). Five measured inputs: wind m/s, measurement height m, dead-fuel moisture fraction, fuel height m, dry load kg/m2. Return nonnegative m/s. Equal-country RMSE on complete held-out countries from Anderson2015. Missing inputs excluded; no invented fuel or slope inputs.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
