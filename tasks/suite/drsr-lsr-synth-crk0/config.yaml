# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    LSR-Synth CRK0

    LSR-Synth CRK0 task evaluated in DrSR: LLM based Scientific Equation Discovery with Dual Reasoning from Data and Experience.

    Candidate interface: equation(X: np.ndarray[n, d], params: np.ndarray[10]) -> np.ndarray[n]; columns of X follow the instance's input_vars; parameters are fitted by BFGS on the train split. Score: mean NMSE on the test split over the selected LLM-SRBench instances

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
