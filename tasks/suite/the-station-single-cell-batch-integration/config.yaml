# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Single-cell batch integration: public scIB adaptation

    Integrate measured count matrices across experimental batches while preserving cell-type neighborhoods and rare populations under a declared transductive protocol.

    Candidate interface: integrate(counts, batch_labels) -> finite cells x dimensions embedding, 1<=dimensions<=128. No cell-type labels supplied. Transductive evaluation. Local scIB-inspired score =0.6 cell-type-macro kNN purity +0.4 within-cell-type batch mixing. Rare-type purity diagnostic. This is an adapted public scIB protocol, not reproduction of Station private scores.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
