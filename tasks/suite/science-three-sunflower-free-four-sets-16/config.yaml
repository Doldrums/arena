# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large four-uniform families without three sunflowers

    construct() -> 1..maximum=250 distinct k=4 element subsets of [1,n=16]. No three distinct sets may have all three pairwise intersections equal, including an empty common core. Maximize family cardinality. Maximize a family of four-element subsets of [1,16], with at most 250 members, excluding three-petal sunflowers including the empty-core case.

    Candidate interface: construct() -> 1..maximum=250 distinct k=4 element subsets of [1,n=16]. No three distinct sets may have all three pairwise intersections equal, including an empty common core. Maximize family cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
