# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Packing edge-disjoint cycles on one vertex set

    construct() -> nonempty list of simple cycles, each represented by a list of distinct vertices with the closing edge implicit. All cycles must use exactly the same vertex set of size at least three in the pinned 21-vertex host. No host edge may occur in two cycles. Maximize number of cycles. The local task maximizes witness multiplicity in the explicit circulant host with steps 1, 2 and 5. This measures the finite cycle-packing quantity and cannot prove a universal chromatic forcing statement.

    Candidate interface: construct() -> nonempty list of simple cycles, each represented by a list of distinct vertices with the closing edge implicit. All cycles must use exactly the same vertex set of size at least three in the pinned 21-vertex host. No host edge may occur in two cycles. Maximize number of cycles.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
