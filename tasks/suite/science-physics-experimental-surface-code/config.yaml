# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Experimental surface-code logical decoding

    decode(detector_events, metadata) -> shot x observable bits. Metadata includes source detector-error model, code distance and observable count. Train/test acquisition batches disjoint. Score logical failure per complete experimental shot, with Wilson confidence interval and timing. PyMatching baseline uses only error model and detector events.

    Candidate interface: decode(detector_events, metadata) -> shot x observable bits. Metadata includes source detector-error model, code distance and observable count. Train/test acquisition batches disjoint. Score logical failure per complete experimental shot, with Wilson confidence interval and timing. PyMatching baseline uses only error model and detector events.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
