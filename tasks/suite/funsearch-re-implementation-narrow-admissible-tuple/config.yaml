# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Narrow admissible tuple

    Construct the largest admissible tuple within [0, 5000] by selecting a removed residue class for each prime. This is the fixed-diameter maximization formulation actually benchmarked in paper Table 2.

    Candidate interface: construct() -> list of distinct integers in [0, n] forming an admissible tuple: for every prime p <= len(tuple) some residue class mod p is missed (FunSearch fixed-diameter formulation). Score: tuple size

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
