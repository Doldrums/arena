# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    MLGWSC gravitational-wave event search

    search(h1, l1, metadata) -> N x 2 GPS time/ranking statistic array. Independent source observing blocks and source injections; triggers clustered and uniquely associated. Score sensitive distance at fixed FAR. At least 10 expected false alarms at the declared FAR must fit in the background duration; tiny noise clips cannot establish rare-event performance.

    Candidate interface: search(h1, l1, metadata) -> N x 2 GPS time/ranking statistic array. Independent source observing blocks and source injections; triggers clustered and uniquely associated. Score sensitive distance at fixed FAR. At least 10 expected false alarms at the declared FAR must fit in the background duration; tiny noise clips cannot establish rare-event performance.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
