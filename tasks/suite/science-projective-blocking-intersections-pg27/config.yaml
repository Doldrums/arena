# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Projective blocking sets with small line intersections in PG(2,7)

    construct() -> distinct point indices in 0..56 for PG(2,7). Point order is (1,x,y) lexicographically for x,y=0..6, then (0,1,x), then (0,0,1). Every projective line must meet the set. Minimize the maximum intersection with any line; line-contained sets are allowed but score at least 8. The local task searches all point subsets in the prime plane of order seven; it does not constrain candidates to unions of algebraic curves or reproduce that paper's proof. The optimum is 4: an exhaustive search shows that no blocking set meets every line in at most 3 points, so this is a rediscovery task.

    Candidate interface: construct() -> distinct point indices in 0..56 for PG(2,7). Point order is (1,x,y) lexicographically for x,y=0..6, then (0,1,x), then (0,0,1). Every projective line must meet the set. Minimize the maximum intersection with any line; line-contained sets are allowed but score at least 8.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
