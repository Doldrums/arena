# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    Constant-weight ternary admissible-set construction

    Evolve the priority rule used by the pinned MCTS-AHD symmetric greedy constructor for constant-weight ternary admissible sets at n=15, w=10. Maximize the cardinality of the expanded set. This is a distinct problem from narrow admissible integer tuples.

    Candidate interface: priority(vector, n, w) -> finite float. The pinned MCTS-AHD solver greedily constructs a symmetric constant-weight admissible set of ternary vectors at n=15, w=10. Score: expanded set cardinality. This is not the prime-residue admissible-tuple problem.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
