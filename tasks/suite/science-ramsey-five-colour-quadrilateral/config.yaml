# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Five-colourings of complete graphs without monochromatic four-cycles (R_5(K2,2))

    construct() -> {'n': n, 'colors': [...]}: one colour in {0,...,4} for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 29. No colour class may contain a four-cycle (no two vertices with two common neighbours in one colour). Maximize n. A valid 5-colouring of K_n certifies R_5(C4) > n. The algebraic construction of Lazebnik and Woldar gives 26 vertices; 27 or 28 would be new.

    Candidate interface: construct() -> {'n': n, 'colors': [...]}: one colour in {0,...,4} for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 29. No colour class may contain a four-cycle (no two vertices with two common neighbours in one colour). Maximize n.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
