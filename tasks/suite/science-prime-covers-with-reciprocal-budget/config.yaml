# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Covering 1..L by prime residue classes with reciprocal budget 1 (primes up to 1000)

    construct() -> classes [[p, r], ...] with distinct primes p <= 1000, 0 <= r < p and sum of 1/p at most 1 (exact rationals). The score is the largest L such that every integer 1..L lies in some class (exact, capped at 10^5). Maximize; L >= 999 would realize the Erdős-Ruzsa covering statement at x = 1000 with C = 1. Covered lengths for x = 1000 and C = 1 are finite evidence for the conjecture; reaching 999 would realize it at this size.

    Candidate interface: construct() -> classes [[p, r], ...] with distinct primes p <= 1000, 0 <= r < p and sum of 1/p at most 1 (exact rationals). The score is the largest L such that every integer 1..L lies in some class (exact, capped at 10^5). Maximize; L >= 999 would realize the Erdős-Ruzsa covering statement at x = 1000 with C = 1.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
