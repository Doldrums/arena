# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Graphs of girth at least five on 45 vertices with many edges

    construct() -> list of edges [u, v] of a simple graph on vertices 0..44 with no triangle and no four-cycle. Maximize the number of edges; the known optimum is 145. The exact value 145 for n = 45 is known; recovering it tests constructions of dense girth-5 graphs.

    Candidate interface: construct() -> list of edges [u, v] of a simple graph on vertices 0..44 with no triangle and no four-cycle. Maximize the number of edges; the known optimum is 145.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
