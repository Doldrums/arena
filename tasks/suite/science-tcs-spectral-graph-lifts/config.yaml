# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Theoretical computer science: Spectral graph-lift construction

    Spectral graph-lift construction under a bounded candidate interface with independent verification; generated mathematical instances, no external dataset.

    Candidate interface: sign_edges(graph, budget) -> +/-1 edge signs. graph contains n and ordered undirected edges. Construct connected 3-regular two-lifts of prism graphs; minimize mean spectral radius of signed adjacency (the new eigenvalues), checked independently. budget=32 is the baseline trial budget; all candidates share the 60-second execution ceiling. Numerical spectral ranking does not certify a general theorem.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
