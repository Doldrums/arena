# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Cosmology: compact dark-energy growth approximation

    Improve a six-coefficient growth-index formula for the linear growth rate and normalized growth factor in smooth CPL dark-energy cosmologies. A tightly integrated general-relativistic second-order ODE provides an independent numerical reference. The score is the worst relative error across both observables on disjoint public validation cosmologies, extending the constant-gamma seed within a fixed compact ansatz.

    Candidate interface: construct() -> real vector of six finite coefficients in [-10,10]. At scale factor a, q=1-Om(a), u=1+w0+wa*(1-a), gamma=c0+c1*q+c2*q^2+c3*u+c4*wa*a+c5*u*q, and f=Om(a)^gamma. Gamma must lie in [0.1,1.2] at all checked locations. The evaluator computes D(a)/D(1)=exp(-integral_ln(a)^0 f(exp(x)) dx). Minimize 100 times the maximum relative error of both f and normalized D over validation models and a values.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
