# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Nearby oppositely ordered fractions in the Farey sequence

    construct() -> [[a,b],[c,d]], two reduced fractions in [0,1] with denominators <=1000, a/b<c/d, and (c-a)*(d-b)<0. Minimize their rank difference in the complete Farey sequence of order 1000, including 0/1 and 1/1. Every rank is recomputed exactly. The local finite search gives an upper certificate for the first possible ordering failure at order 1000. It corrects the feasibility draft's unrelated strictly monotone-run objective. The optimum is 252, found by scanning the complete Farey sequence of order 1000; this is a rediscovery task.

    Candidate interface: construct() -> [[a,b],[c,d]], two reduced fractions in [0,1] with denominators <=1000, a/b<c/d, and (c-a)*(d-b)<0. Minimize their rank difference in the complete Farey sequence of order 1000, including 0/1 and 1/1. Every rank is recomputed exactly.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
