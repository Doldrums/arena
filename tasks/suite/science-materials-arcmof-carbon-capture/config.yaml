# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    ARC-MOF carbon-capture material selection

    select_mofs(descriptors, operating_conditions, observations, budget) -> list of unused integer MOF indices. Observations reveal computed working_capacity_mol_kg and selectivity. One query per call, maximum twenty queries. Score highest observed capacity meeting the operating-condition selectivity constraint divided by the pool optimum. Topology/chemistry groups remain disjoint and target-derived descriptors are forbidden.

    Candidate interface: select_mofs(descriptors, operating_conditions, observations, budget) -> list of unused integer MOF indices. Observations reveal computed working_capacity_mol_kg and selectivity. One query per call, maximum twenty queries. Score highest observed capacity meeting the operating-condition selectivity constraint divided by the pool optimum. Topology/chemistry groups remain disjoint and target-derived descriptors are forbidden.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
