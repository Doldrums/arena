# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Contact numbers of 32 unit pennies on the triangular lattice

    construct() -> exactly 32 distinct integer pairs [a, b] with |a|, |b| <= 64 denoting lattice points a + b*omega, omega = exp(i*pi/3), which are at mutual distance at least one. Maximize the number of pairs at distance exactly one; Harborth's theorem gives the optimum floor(3n - sqrt(12n - 3)) = 76. Harborth's formula gives 76 for n = 32 and triangular-lattice spirals attain it, so the lattice restriction loses nothing.

    Candidate interface: construct() -> exactly 32 distinct integer pairs [a, b] with |a|, |b| <= 64 denoting lattice points a + b*omega, omega = exp(i*pi/3), which are at mutual distance at least one. Maximize the number of pairs at distance exactly one; Harborth's theorem gives the optimum floor(3n - sqrt(12n - 3)) = 76.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
