# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Small sums and products along selected graph edges

    construct() -> {'values': fourteen distinct positive integers <=10000, 'edges': exactly 35 simple undirected edges on their indices}. Minimize max(number of distinct edge sums, number of distinct edge products). Only edges between different vertices count. The local restrictions are fourteen positive integer labels, 35 edges and label cap 10000. The max objective is stated explicitly; this does not reproduce the paper’s asymptotic graph constructions or claim a new counterexample.

    Candidate interface: construct() -> {'values': fourteen distinct positive integers <=10000, 'edges': exactly 35 simple undirected edges on their indices}. Minimize max(number of distinct edge sums, number of distinct edge products). Only edges between different vertices count.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
