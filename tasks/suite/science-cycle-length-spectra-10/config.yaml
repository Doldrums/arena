# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Realizing every set of cycle lengths on 10 vertices

    construct() -> a list of at most 500 simple graphs on vertices 0..9, each a list of edges [u, v]. The cycle set of a graph (the lengths of its cycles, computed exactly by dynamic programming over paths) is recorded for every graph. Maximize the number of distinct cycle sets; the optimum is 133. There are exactly 133 cycle sets on 10 vertices, so a complete collection recovers f(10).

    Candidate interface: construct() -> a list of at most 500 simple graphs on vertices 0..9, each a list of edges [u, v]. The cycle set of a graph (the lengths of its cycles, computed exactly by dynamic programming over paths) is recorded for every graph. Maximize the number of distinct cycle sets; the optimum is 133.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
