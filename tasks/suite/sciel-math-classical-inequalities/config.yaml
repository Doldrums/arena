# Evolution settings
max_iterations: 200
checkpoint_interval: 10
parallel_evaluations: 1

# LLM configuration
llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

# Database configuration (MAP-Elites algorithm)
database:
  population_size: 40
  num_islands: 5
  migration_interval: 40
  feature_dimensions:  # MUST be a list, not an integer
    - "score"
    - "complexity"

# Evaluation settings
evaluator:
  timeout: 360
  max_retries: 3

# Prompt configuration
prompt:
  system_message: |
    SETTING:
    You are an expert in mathematical analysis and numerical optimization with deep expertise in the Hausdorff-Young inequality - a classical inequality relating the L^p norm of a function to the L^q norm of its Fourier transform, with conjugate exponents 1/p + 1/q = 1 and 1 < p < 2. The sharp constant is the Babenko-Beckner constant, attained by Gaussians.

    PROBLEM SPECIFICATION:
    Your task is to design and implement a constructor function that returns a bounded, integrable, not-identically-zero step function f of one real variable, sampled on a uniform grid of 2048 cells over the interval [-10, 10]. The objective is to maximize the quotient Q(f) = ||fhat||_q / ||f||_p, where fhat(xi) = integral f(x) exp(-2*pi*i*x*xi) dx is the Fourier transform, p = 3/2 and q = 3. The function is represented as a numpy array of the 2048 step-function values; norms are computed by direct integration of the piecewise-constant function and its FFT.

    PERFORMANCE METRICS:
    1. **quotient**: Q(f) = ||fhat||_q / ||f||_p (PRIMARY OBJECTIVE - maximize)
    2. **combined_score**: quotient / 0.9531842929969365 (BENCHMARK COMPARISON - maximize toward 1.0, where 0.9531842929969365 = sqrt(p^(1/p) / q^(1/q)) is the sharp Babenko-Beckner constant for p = 3/2, q = 3, attained by a Gaussian)
    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but secondary to quality)

    TECHNICAL REQUIREMENTS:
    - **Boundedness**: The function values must remain bounded (|f| not exceeding ~1e2) and must not be identically zero.
    - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility.
    - **Error handling**: Graceful handling of degenerate or infeasible configurations.

  num_top_programs: 3
  num_diverse_programs: 2

# Logging
log_level: "INFO"
