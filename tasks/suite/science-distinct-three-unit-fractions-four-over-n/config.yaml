# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Distinct three-term unit-fraction representations of 4/n

    construct() -> 254 rows for n=3..256. Each row is None or three DISTINCT positive integer denominators x,y,z<=1000000000000 with 1/x+1/y+1/z=4/n. Maximize fraction solved. Equality is checked by cross multiplication and malformed claims invalidate the candidate. Construct distinct positive denominators for n=3..256, with denominator bound10^12. The prize bank requires distinctness, which is stricter than the paper’s general solution definition; no universal proof or published computation is reproduced.

    Candidate interface: construct() -> 254 rows for n=3..256. Each row is None or three DISTINCT positive integer denominators x,y,z<=1000000000000 with 1/x+1/y+1/z=4/n. Maximize fraction solved. Equality is checked by cross multiplication and malformed claims invalidate the candidate.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
