# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    OC20-Dense catalyst adsorption-site search

    choose_configuration(surface, adsorbate, configurations, observations) -> unused integer configuration index. Observations reveal index, DFT energy_ev and physically_valid after each query. Score fraction of unseen adsorbate/surface groups finding a physically valid configuration within 0.1 eV of the finite OC20-Dense pool minimum after at most ten queries. Candidate may not introduce unvalidated coordinates.

    Candidate interface: choose_configuration(surface, adsorbate, configurations, observations) -> unused integer configuration index. Observations reveal index, DFT energy_ev and physically_valid after each query. Score fraction of unseen adsorbate/surface groups finding a physically valid configuration within 0.1 eV of the finite OC20-Dense pool minimum after at most ten queries. Candidate may not introduce unvalidated coordinates.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
