# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Earth science: Seasonal Arctic sea-ice probabilities

    Seasonal Arctic sea-ice probabilities with an explicit candidate interface, physical units, independent evaluator and source-traceable observations or numerical model.

    Candidate interface: forecast_ice(history, past_climate_covariates, lead_months) -> (448,304) probabilities in[0,1] for monthly concentration>=0.15. Six actual NOAA/NSIDC G02202 v02r00 forecasts: July-December2013/2014 monthly histories predict next-year January/March/June at1/3/6-month leads. Native25km grid; area-weighted Brier over valid ocean north of60N using ellipsoidal cell areas, projected-km symmetric edge-distance diagnostic. Land/coast/pole-hole/missing flags excluded. Zeros outside supplied history_ocean_mask are placeholders. No future fields cross API. Historical NOAA observational adaptation, not original IceNet OSISAF data or leaderboard reproduction.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
