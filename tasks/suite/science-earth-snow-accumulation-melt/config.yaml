# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Earth science: Snow accumulation and melt across sites

    Snow accumulation and melt across sites with an explicit candidate interface, physical units, independent evaluator and source-traceable observations or numerical model.

    Candidate interface: snow_step(meteorology, snow_state, site_parameters) -> {swe,melt,sublimation}, all mm water equivalent per step. Hourly snowfall and temperature; melt drains immediately. Enforce exact solid-water balance and nonnegative stores/fluxes. Site-winter macro RMSE against measured ESM-SnowMIP SWE; first31days spin up. Degree-day seed, four whole winters at two sites. This adaptation does not check energy conservation or reproduce every FSM2 process.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
