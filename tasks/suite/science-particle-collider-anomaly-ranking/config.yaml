# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    LHCO control-region collider anomalies

    fit(control_features) -> object with score(events). Input consists of pinned physics features derived from official LHCO Pythia/Delphes events; candidate never receives signal truth. Independent training, test and no-signal source event blocks. Score SIC at 5 percent background divided by one plus mass-sculpting chi-square. Report no-signal acceptance and AUROC; no discovery p value.

    Candidate interface: fit(control_features) -> object with score(events). Input consists of pinned physics features derived from official LHCO Pythia/Delphes events; candidate never receives signal truth. Independent training, test and no-signal source event blocks. Score SIC at 5 percent background divided by one plus mass-sculpting chi-square. Report no-signal acceptance and AUROC; no discovery p value.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
