# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Sidon sets containing 0 whose differences include 1, ..., 30 (prefixes of perfect difference sets)

    construct() -> at most 32 distinct integers in 0..10^6 including 0, with all positive differences distinct (a Sidon set) and every d in 1..30 occurring as a difference. Minimize the largest element. A Sidon set realizing all differences 1..30 is a truncated perfect difference set; its least possible diameter measures the growth cost at this scale.

    Candidate interface: construct() -> at most 32 distinct integers in 0..10^6 including 0, with all positive differences distinct (a Sidon set) and every d in 1..30 occurring as a difference. Minimize the largest element.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
