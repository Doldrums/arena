# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Critical-regime XY Monte Carlo schedules

    schedule(temperature, lattice_size, budget) -> list of 1..64 kernel names: metropolis, overrelax, wolff, containing a stochastic kernel. Trusted detailed-balance kernels operate classical periodic XY model. Each sweep/cluster is charged N site units (upper bound); warmup counts. Multiple independent chains score squared energy/magnetization errors against long independent reference chains, with reference uncertainty and autocorrelation diagnostics. Fixed-work local adaptation, not a timing leaderboard.

    Candidate interface: schedule(temperature, lattice_size, budget) -> list of 1..64 kernel names: metropolis, overrelax, wolff, containing a stochastic kernel. Trusted detailed-balance kernels operate classical periodic XY model. Each sweep/cluster is charged N site units (upper bound); warmup counts. Multiple independent chains score squared energy/magnetization errors against long independent reference chains, with reference uncertainty and autocorrelation diagnostics. Fixed-work local adaptation, not a timing leaderboard.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
