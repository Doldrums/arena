# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Few distinct small-prime parts in a short integer interval

    Return n in [1000,1000000]. For each n+i,1<=i<=24, extract its complete factor composed of primes STRICTLY BELOW 24. MINIMIZE the number of distinct extracted factors. Uses the source minimum f(n,t) at t=24, correcting the preliminary feasibility proposal's reversed direction; the source asks for a uniform lower bound on this minimum.

    Candidate interface: construct() -> candidate. Return n in [1000,1000000]. For each n+i,1<=i<=24, extract its complete factor composed of primes STRICTLY BELOW 24. MINIMIZE the number of distinct extracted factors.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
