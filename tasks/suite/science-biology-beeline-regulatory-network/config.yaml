# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Regulatory network inference from expression

    Rank directed regulator-target hypotheses from the official BEELINE GSD expression example and score all allowed edges using tie-aware average precision.

    Candidate interface: infer_network(expression, genes, allowed_regulators, optional_ordering) -> list(regulator,target,finite_score). expression cells x genes. No self edges/unknown IDs/duplicates. Unsubmitted edges tie below submitted scores. Maximize tie-grouped average precision across all allowed directed edges; incomplete biological references caveat retained.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
