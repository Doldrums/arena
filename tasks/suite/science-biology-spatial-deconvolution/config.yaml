# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Spatial transcriptomic cell abundance inference

    Infer nonnegative spatial cell counts from reference expression signatures and evaluate separate held-out genes using a count likelihood.

    Candidate interface: deconvolve(spatial_counts, reference_profiles, coordinates) -> nonnegative spots x cell_types absolute abundances. Inputs include training genes only and calibrated per-cell signatures. Minimize Poisson NLL of separate held-out genes, using trusted full reference profiles. Known constructed-mixture composition is diagnostic only.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
