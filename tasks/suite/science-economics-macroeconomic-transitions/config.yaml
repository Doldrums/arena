# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Economics: Heterogeneous-agent macroeconomic transitions

    Heterogeneous-agent macroeconomic transitions with an explicit candidate API, independently recomputed objective and fixed model/data assumptions.

    Candidate interface: solve_transition(model, steady_state, aggregate_shock) -> length40 capital DEVIATIONS from steady state. Fixed sequence-jacobian Krusell-Smith source example (2 income states,10 asset nodes);24period productivity shocks plus16zero periods; household continuation uses fixed terminal steady-state value. Independently recompute nonlinear household/distribution/market paths. Minimize mean maximum asset-market residual / steady-state capital; check probability mass, positive consumption and feasible assets. Source household optimizer is fixed; candidate evolves equilibrium-path solution.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
