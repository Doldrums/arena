# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Longest string of pairwise distinct consecutive prime gaps below 10^8

    construct() -> {'start': p, 'length': k} with p prime, 1 <= k <= 200, and the k + 1 consecutive primes beginning at p all at most 10^8. The k gaps between them must be pairwise distinct. Maximize k; the optimum below 10^8 is 21. Among primes below 10^8 the longest string has 21 distinct gaps, so the task recovers it.

    Candidate interface: construct() -> {'start': p, 'length': k} with p prime, 1 <= k <= 200, and the k + 1 consecutive primes beginning at p all at most 10^8. The k gaps between them must be pairwise distinct. Maximize k; the optimum below 10^8 is 21.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
