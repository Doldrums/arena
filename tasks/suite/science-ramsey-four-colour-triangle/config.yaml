# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Four-colourings of complete graphs without monochromatic triangles (R(3,3,3,3))

    construct() -> {'n': n, 'colors': [...]}: one colour in {0,1,2,3} for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 62. No colour class may contain a triangle. Maximize n. A valid 4-colouring of K_n certifies R_4(3) > n. Chung's 50-vertex colouring is the record; 51 vertices would be new.

    Candidate interface: construct() -> {'n': n, 'colors': [...]}: one colour in {0,1,2,3} for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 62. No colour class may contain a triangle. Maximize n.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
