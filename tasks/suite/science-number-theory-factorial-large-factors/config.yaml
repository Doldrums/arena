# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Factorial decompositions into distinct factors above the index

    Return 1..12 DISTINCT integers all greater than 12, with product exactly 12!. Minimize the LARGEST factor; the number of factors is variable. Exact finite version of equation(6). Distinct from the existing100! benchmark: no fixed factor count, all factors must exceed12, and the objective minimizes the largest rather than maximizing the smallest.

    Candidate interface: construct() -> candidate. Return 1..12 DISTINCT integers all greater than 12, with product exactly 12!. Minimize the LARGEST factor; the number of factors is variable.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
