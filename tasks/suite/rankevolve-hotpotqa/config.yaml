# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 14520
  max_retries: 2

prompt:
  system_message: |
    hotpotqa

    hotpotqa task evaluated in RankEvolve: Automating the Discovery of Retrieval Algorithms via LLM-Driven Evolution.

    Candidate interface: Python module exports BM25, Corpus, tokenize and LuceneTokenizer. Corpus(tokenized_documents, ids=corpus_ids); BM25(corpus).rank(query_tokens, top_k=100) returns paired unique integer document indices and finite scores in descending order.

    Preserve the declared BM25, Corpus, tokenize and LuceneTokenizer interface.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
