# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Fewest four-cycles in graphs with 31 vertices and 91 edges

    construct() -> exactly 91 distinct edges [u, v] on vertices 0..30 (one more than ex(31;C4) = 90). The score is the exact number of four-cycles (subgraphs). Minimize. n = 31 = 5^2+5+1 is a polarity-graph order with odd q = 5, not covered by the He-Ma-Yang theorem; no minimum count is documented.

    Candidate interface: construct() -> exactly 91 distinct edges [u, v] on vertices 0..30 (one more than ex(31;C4) = 90). The score is the exact number of four-cycles (subgraphs). Minimize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
