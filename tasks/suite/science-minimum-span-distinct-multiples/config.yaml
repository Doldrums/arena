# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Pack distinct multiples of a fixed integer set

    construct() -> ten DISTINCT positive Python integers <=1000000, aligned with the pinned input [6,10,14,15,21,22,26,33,35,39]. Each representative must be divisible by its corresponding input. Minimize max(representatives)-min(representatives), the length of their closed enclosing interval. The bank’s full-matching minimum-span question is used literally for one fixed ten-element input and a representative cap. The cited related paper instead optimizes guaranteed partial cardinality in every fixed-length interval. Its theorem is not evidence of a solution or precise importance classification for this changed objective.

    Candidate interface: construct() -> ten DISTINCT positive Python integers <=1000000, aligned with the pinned input [6,10,14,15,21,22,26,33,35,39]. Each representative must be divisible by its corresponding input. Minimize max(representatives)-min(representatives), the length of their closed enclosing interval.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
