# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Large subsets of {1, ..., 1000} in which every sum has at most two representations (B2[2] sets)

    construct() -> distinct integers in 1..1000 such that every integer has at most two representations a + b with a <= b from the set (exact count). Maximize the size. Sizes for N = 1000 are finite lower bounds for the extremal function (the asymptotic constant is at least 3/2); no finite optimum is documented.

    Candidate interface: construct() -> distinct integers in 1..1000 such that every integer has at most two representations a + b with a <= b from the set (exact count). Maximize the size.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
