# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Two Sidon sets with disjoint difference sets

    construct() -> [A,B], two nonempty Sidon subsets of [1,n=256], at most 64 elements each. Pair sums inside each set, including a+a, must be unique. Their nonzero difference sets must be disjoint. Maximize |A|+|B|; A and B need not themselves be disjoint. Two Sidon subsets of [1,256]; maximize combined size and require disjoint nonzero differences. Ordinary Sidon diagonals are included, and the two sets themselves may overlap.

    Candidate interface: construct() -> [A,B], two nonempty Sidon subsets of [1,n=256], at most 64 elements each. Pair sums inside each set, including a+a, must be unique. Their nonzero difference sets must be disjoint. Maximize |A|+|B|; A and B need not themselves be disjoint.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
