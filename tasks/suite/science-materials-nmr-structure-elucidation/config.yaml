# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    NMR molecular structure elucidation

    elucidate(h_spectrum, c_spectrum, metadata, k) -> list of one to k distinct molecular SMILES. Metadata may include formula and target-free candidate_smiles. Score exact RDKit-canonical molecular graph recovery in top five; top1 is diagnostic. Enforce valid connected graph and supplied formula. Stereochemistry is ignored only when source labels do not resolve it. Simulated and experimental source subsets must remain separate.

    Candidate interface: elucidate(h_spectrum, c_spectrum, metadata, k) -> list of one to k distinct molecular SMILES. Metadata may include formula and target-free candidate_smiles. Score exact RDKit-canonical molecular graph recovery in top five; top1 is diagnostic. Enforce valid connected graph and supplied formula. Stereochemistry is ignored only when source labels do not resolve it. Simulated and experimental source subsets must remain separate.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
