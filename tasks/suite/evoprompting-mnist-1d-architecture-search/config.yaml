# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    MNIST-1D architecture search

    MNIST-1D architecture search: optimize the candidate specified by the paper and evaluate against the named benchmark.

    Candidate interface: build_model() -> torch.nn.Module mapping (batch, 40) float inputs to (batch, 10) logits, with at most MAX_PARAMETERS parameters. The evaluator trains it with Adam (lr 1e-3, batch 128, STEPS steps) on the deterministic MNIST-1D training set and reports test_error + 0.05 * parameters / 100000. Lower is better.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
