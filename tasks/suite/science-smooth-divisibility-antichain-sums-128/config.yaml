# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Divisibility-antichain representations by smooth numbers

    construct() -> 128 rows corresponding to targets 1..128. Every row must contain 1..30 distinct positive 2^a*3^b*5^c terms summing to its target; no chosen term may divide another. All targets require valid representations. Minimize the total number of summands over all targets, an explicit local refinement of finite d-completeness. Represent targets 1..128 by sums of distinct 2,3,5-smooth numbers forming a divisibility antichain. All targets require valid representations; minimizing the total term count is an explicit local efficiency refinement of finite d-completeness. The seed uses up to three terms and is not term-minimal.

    Candidate interface: construct() -> 128 rows corresponding to targets 1..128. Every row must contain 1..30 distinct positive 2^a*3^b*5^c terms summing to its target; no chosen term may divide another. All targets require valid representations. Minimize the total number of summands over all targets, an explicit local refinement of finite d-completeness.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
