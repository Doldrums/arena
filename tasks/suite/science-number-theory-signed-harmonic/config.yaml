# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Small nonzero signed harmonic subsums

    Return exactly 30 integer coefficients from {-1,0,1}. The signed sum coefficient[i-1]/i must be nonzero. Minimize its absolute value; exact numerator and denominator are reported. Finite signed-harmonic extremum with the zero sum excluded; no asymptotic separation claim.

    Candidate interface: construct() -> candidate. Return exactly 30 integer coefficients from {-1,0,1}. The signed sum coefficient[i-1]/i must be nonzero. Minimize its absolute value; exact numerator and denominator are reported.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
