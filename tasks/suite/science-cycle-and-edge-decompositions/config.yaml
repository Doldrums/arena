# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Decompositions of three fixed graphs into few cycles and edges (Erdős-Gallai)

    construct() -> three lists of pieces, one per fixed instance graph generated by instance_graph(n, p, seed) for (20,0.4,11), (25,0.35,12), (30,0.3,13) in the verifier. A piece is a single edge [u, v] or a cycle given by at least three distinct vertices (the closing edge is implied). Pieces must be edge-disjoint and cover all edges. Minimize the total number of pieces. The score counts pieces over three fixed random graphs; it measures decomposition algorithms, not the conjecture's constant.

    Candidate interface: construct() -> three lists of pieces, one per fixed instance graph generated by instance_graph(n, p, seed) for (20,0.4,11), (25,0.35,12), (30,0.3,13) in the verifier. A piece is a single edge [u, v] or a cycle given by at least three distinct vertices (the closing edge is implied). Pieces must be edge-disjoint and cover all edges. Minimize the total number of pieces.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
