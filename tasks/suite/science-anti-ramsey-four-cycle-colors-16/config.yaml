# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Many edge colors without a rainbow four-cycle

    construct() -> 120 integer colors in 0..119 for the lexicographically ordered pairs (i,j), 0<=i<j<16. No four-cycle may have four distinct edge colors. Maximize the number of colors actually used; all three cycles on every four-vertex subset are checked. The n=16, cycle-length-four task searches extremal colorings for a solved finite specialization, using an independently written exhaustive verifier.

    Candidate interface: construct() -> 120 integer colors in 0..119 for the lexicographically ordered pairs (i,j), 0<=i<j<16. No four-cycle may have four distinct edge colors. Maximize the number of colors actually used; all three cycles on every four-vertex subset are checked.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
