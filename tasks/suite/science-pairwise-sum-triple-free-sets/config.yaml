# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large sets without a triple and all its pair sums

    construct() -> distinct integers in 1..128. Forbid THREE DISTINCT members a,b,c for which a+b, a+c and b+c are also selected. The six displayed values need not be mutually distinct. Maximize set size. The local interval ends at 128. The evaluator uses only exact finite checks and does not assume the preprint’s proof, novelty, status, or Lean verification. The baseline is the elementary upper half interval.

    Candidate interface: construct() -> distinct integers in 1..128. Forbid THREE DISTINCT members a,b,c for which a+b, a+c and b+c are also selected. The six displayed values need not be mutually distinct. Maximize set size.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
