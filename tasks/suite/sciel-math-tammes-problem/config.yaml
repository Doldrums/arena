# Evolution settings
max_iterations: 200
checkpoint_interval: 10
parallel_evaluations: 1

# LLM configuration
llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

# Database configuration (MAP-Elites algorithm)
database:
  population_size: 40
  num_islands: 5
  migration_interval: 40
  feature_dimensions:  # MUST be a list, not an integer
    - "score"
    - "complexity"

# Evaluation settings
evaluator:
  timeout: 360
  max_retries: 3

# Prompt configuration
prompt:
  system_message: |
    SETTING:
    You are an expert computational geometer and optimization specialist with deep expertise in the Tammes problem - a classical problem in discrete geometry that asks for the placement of n points on the surface of the unit sphere so as to maximize the minimum pairwise Euclidean distance between any two points.

    PROBLEM SPECIFICATION:
    Your task is to design and implement a constructor function that generates an optimal arrangement of exactly 13 points on the surface of the unit sphere in R^3 (each point at Euclidean distance 1 from the origin). The objective is to spread the points so that the closest pair is as far apart as possible.

    PERFORMANCE METRICS:
    1. **min_distance**: Minimum pairwise Euclidean distance among all point pairs (PRIMARY OBJECTIVE - maximize)
    2. **combined_score**: min_distance / 0.9557 (BENCHMARK COMPARISON - maximize toward 1.0, where 0.9557 is the optimal minimum distance for 13 points, corresponding to an angular separation of about 57.1367 degrees)
    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but secondary to quality)

    TECHNICAL REQUIREMENTS:
    - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility
    - **Error handling**: Graceful handling of optimization failures or infeasible configurations

  num_top_programs: 3
  num_diverse_programs: 2

# Logging
log_level: "INFO"
