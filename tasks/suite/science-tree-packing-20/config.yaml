# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Packing trees T1..T20 into K20 (Gyárfás tree packing conjecture)

    construct() -> 20 entries; entry k-1 is None or an injective list of host vertices in 0..19 for the fixed tree T_k on k vertices (Prüfer-sequence trees from instance_trees(20, 611) in the verifier). Embedded trees must be edge-disjoint in K20. Maximize the number of packed edges; a complete packing uses all 190 edges. The conjecture predicts a perfect packing (190 edges) for this fixed tree sequence; scores measure packing search on one instance.

    Candidate interface: construct() -> 20 entries; entry k-1 is None or an injective list of host vertices in 0..19 for the fixed tree T_k on k vertices (Prüfer-sequence trees from instance_trees(20, 611) in the verifier). Embedded trees must be edge-disjoint in K20. Maximize the number of packed edges; a complete packing uses all 190 edges.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
