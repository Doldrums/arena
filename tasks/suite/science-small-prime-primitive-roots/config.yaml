# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Small prime primitive roots for twelve prime moduli

    construct() -> twelve Python prime integers, one for each modulus [101,103,107,109,113,127,131,137,139,149,151,157]. Each root is at most 100000, coprime to its modulus, and has multiplicative order p-1. Minimize the sum of these prime roots. Twelve small fixed moduli provide a finite construction/rediscovery instance; exact orders are verified without reproducing the shifted sieve.

    Candidate interface: construct() -> twelve Python prime integers, one for each modulus [101,103,107,109,113,127,131,137,139,149,151,157]. Each root is at most 100000, coprime to its modulus, and has multiplicative order p-1. Minimize the sum of these prime roots.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
