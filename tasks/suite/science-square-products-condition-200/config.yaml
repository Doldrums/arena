# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Subsets of {1, ..., 200} in which square products of four elements force ad = bc

    construct() -> distinct integers in 1..200 such that whenever a <= b <= c <= d are elements (repetition allowed) with abcd a perfect square, ad = bc (checked exactly through parity vectors of prime exponents). Maximize the size; the optimum is 102. For n = 200 the maximum is 102, so the task recovers an extremal set.

    Candidate interface: construct() -> distinct integers in 1..200 such that whenever a <= b <= c <= d are elements (repetition allowed) with abcd a perfect square, ad = bc (checked exactly through parity vectors of prime exponents). Maximize the size; the optimum is 102.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
