# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Long binary colorings without four-term progressions

    construct() -> a list of integer colors 0 or 1, length between k=4 and maximum=512. No nonconstant four-term arithmetic progression of positions may be monochromatic. Maximize length. Maximize binary-coloring length up to 512 with no monochromatic four-term arithmetic progression. The paper determines the six-term case; this smaller four-term instance is a known finite rediscovery exercise.

    Candidate interface: construct() -> a list of integer colors 0 or 1, length between k=4 and maximum=512. No nonconstant four-term arithmetic progression of positions may be monochromatic. Maximize length.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
