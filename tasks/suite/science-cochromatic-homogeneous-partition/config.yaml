# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Cochromatic partitions of a pinned random graph

    construct() -> partition of vertices 0..13 into nonempty lists. Every part must induce a clique or an independent set, and vertices occur exactly once. Minimize number of parts. The evaluator independently reports the exact ordinary chromatic number by subset dynamic programming. One explicit G(14,1/2) sample, generated locally with random.Random(506), is optimized. The candidate score is a cochromatic upper bound, not an asymptotic random-graph result or a guaranteed optimal partition.

    Candidate interface: construct() -> partition of vertices 0..13 into nonempty lists. Every part must induce a clique or an independent set, and vertices occur exactly once. Minimize number of parts. The evaluator independently reports the exact ordinary chromatic number by subset dynamic programming.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
