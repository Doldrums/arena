# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    Jericho Temple

    Jericho Temple task evaluated in Learning to Learn-at-Test-Time: Language Agents with Learnable Adaptation Policies.

    Candidate interface: act(observation, valid_actions, history, llm) -> str: the next text command. observation is the game text after the last command, valid_actions the parser-accepted commands for the current state, history the list of (action, observation, reward) so far, llm the cached budgeted OpenRouter client (llm(prompt, system=None, max_tokens=None) -> str). Score: final game score / maximum score after STEPS commands, averaged over RUNS seeded plays. Higher is better.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
