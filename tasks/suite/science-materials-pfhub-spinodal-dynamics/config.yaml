# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    PFHub spinodal decomposition integration

    evolve_composition(initial_field, parameters, times) -> array (len(times),N,N). Integrate dc/dt=M*L[f'(c)-kappa*L(c)] using the specified second-order periodic discrete Laplacian on [0,200)^2; f=rho*(c-alpha)^2*(c-beta)^2 with alpha=.3,beta=.7,rho=5,M=5,kappa=2. Score candidate wall time only when RMSE<=2e-5 versus independent DOP853, mass drift<1e-9 and discrete free energy never increases. Two fixed meshes 48 and 64, published initial condition and a phase-shift adaptation, times 1,5,20. These are explicit short-horizon, fixed-mesh adaptations, not a reproduction of PFHub equilibrium results.

    Candidate interface: evolve_composition(initial_field, parameters, times) -> array (len(times),N,N). Integrate dc/dt=M*L[f'(c)-kappa*L(c)] using the specified second-order periodic discrete Laplacian on [0,200)^2; f=rho*(c-alpha)^2*(c-beta)^2 with alpha=.3,beta=.7,rho=5,M=5,kappa=2. Score candidate wall time only when RMSE<=2e-5 versus independent DOP853, mass drift<1e-9 and discrete free energy never increases. Two fixed meshes 48 and 64, published initial condition and a phase-shift adaptation, times 1,5,20. These are explicit short-horizon, fixed-mesh adaptations, not a reproduction of PFHub equilibrium results.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
