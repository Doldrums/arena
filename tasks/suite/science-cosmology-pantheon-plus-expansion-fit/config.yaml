# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Expansion-history models fitted to the Pantheon+ supernova Hubble diagram

    Propose a parametric expansion history E(z) = H(z)/H0 with at most six parameters and fit it to the 1,580 Pantheon+ Type Ia supernova light curves with zHD > 0.01 (the 1,590-object cosmology sample minus the ten Cepheid-host calibrators) (corrected apparent magnitudes and the full statistical plus systematic covariance). The absolute magnitude is profiled analytically; the score is the minimum chi-squared, lower is better. Flat LambdaCDM with a fitted matter density is reported for comparison.

    Candidate interface: expansion(z, theta) -> array E(z) = H(z)/H0 for an array of redshifts z >= 0 (positive, finite; E(0) should be 1); initial_theta() -> initial parameter vector (1 to 6 values); bounds() -> list of (low, high) per parameter. The evaluator fits theta to the Pantheon+ Hubble diagram (zHD > 0.01 and no Cepheid calibrators: 1,580 light curves, STAT+SYS covariance) with the absolute magnitude profiled analytically and H0 = 70 fixed for the distance scale; score is the minimum chi-squared (lower is better). Flat LambdaCDM (fitted Omega_m) chi-squared is reported for comparison.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
