# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Two-colourings of K11 with few edge-disjoint monochromatic triangles

    construct() -> {'n': 11, 'colors': [...]}: colour 0 or 1 for each of the 55 pairs (i,j), i<j, in lexicographic order. The score is the maximum number of edge-disjoint monochromatic triangles, computed exactly per colour by branch and bound. Minimize; the known optimum is 6. Any colouring gives an upper bound on the minimum; the tabulated value for n = 11 is 6.

    Candidate interface: construct() -> {'n': 11, 'colors': [...]}: colour 0 or 1 for each of the 55 pairs (i,j), i<j, in lexicographic order. The score is the maximum number of edge-disjoint monochromatic triangles, computed exactly per colour by branch and bound. Minimize; the known optimum is 6.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
