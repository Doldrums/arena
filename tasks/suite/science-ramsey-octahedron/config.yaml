# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Two-colourings without a monochromatic octahedron K2,2,2 (R(K2,2,2))

    construct() -> {'n': n, 'colors': [...]}: colour 0 or 1 for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 31. Neither colour class may contain K2,2,2 as a (not necessarily induced) subgraph. Maximize n. A valid colouring of K_n certifies R(K2,2,2) > n. The record has 29 vertices; a 30-vertex colouring would prove R(K2,2,2) = 31.

    Candidate interface: construct() -> {'n': n, 'colors': [...]}: colour 0 or 1 for each pair (i,j), i<j, of vertices 0..n-1 in lexicographic order, 1 <= n <= 31. Neither colour class may contain K2,2,2 as a (not necessarily induced) subgraph. Maximize n.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
