# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Few edges in 5-uniform hypergraphs without Property B (m(5))

    construct() -> {'n': n, 'edges': [[v1, ..., v5], ...]}: distinct 5-element edges on vertices 0..n-1 with 5 <= n <= 26 and at most 200 edges. The hypergraph must have no proper 2-colouring (no colouring of the vertices leaves every edge with both colours), checked exactly by backtracking with unit propagation. Minimize the number of edges. A valid hypergraph with e edges certifies m(5) <= e; the best known construction has 51 edges and every 5-uniform hypergraph with at most 28 edges is 2-colourable.

    Candidate interface: construct() -> {'n': n, 'edges': [[v1, ..., v5], ...]}: distinct 5-element edges on vertices 0..n-1 with 5 <= n <= 26 and at most 200 edges. The hypergraph must have no proper 2-colouring (no colouring of the vertices leaves every edge with both colours), checked exactly by backtracking with unit propagation. Minimize the number of edges.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
