# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    E. coli growth

    E. coli growth task evaluated in CoEvo: Continual Evolution of Symbolic Solutions Using Large Language Models.

    Candidate interface: equation(<inputs>, params: np.ndarray[10]) -> np.ndarray prediction (LLM-SR contract); the ten parameters are fitted by BFGS on the training split. Score: NMSE on the in-distribution test split (OOD split also reported)

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
