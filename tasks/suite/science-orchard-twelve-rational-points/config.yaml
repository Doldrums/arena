# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Twelve rational points with many three-point lines (orchard problem)

    construct() -> exactly 12 distinct integer points [x, y] with |x|, |y| <= 10^30 (any rational configuration can be scaled to integers). Maximize the number of lines containing exactly three of the points, computed exactly; the optimum is 19. The real maximum for 12 points is 19, and the group law on a rational cubic with 12-torsion realizes it with rational points, so the rational optimum is also 19.

    Candidate interface: construct() -> exactly 12 distinct integer points [x, y] with |x|, |y| <= 10^30 (any rational configuration can be scaled to integers). Maximize the number of lines containing exactly three of the points, computed exactly; the optimum is 19.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
