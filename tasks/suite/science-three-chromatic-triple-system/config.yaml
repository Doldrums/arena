# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Few hyperedges forcing three colors

    construct() -> {'edges': distinct triples on 0..8, 'colors': nine labels from 0..2}. Every edge must be nonmonochromatic in the provided coloring. The evaluator exhaustively rejects any hypergraph admitting a two-coloring. Minimize edge count among exactly three-chromatic triple systems. This is a rediscovery task: the literature states the optimum f(3,3)=7, attainable within nine vertices. The ten-edge complete-triple-system baseline can improve to that known optimum; no mathematical novelty is asserted.

    Candidate interface: construct() -> {'edges': distinct triples on 0..8, 'colors': nine labels from 0..2}. Every edge must be nonmonochromatic in the provided coloring. The evaluator exhaustively rejects any hypergraph admitting a two-coloring. Minimize edge count among exactly three-chromatic triple systems.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
