# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Prime decompositions of even integers

    construct() -> 256 rows for even targets 1000000+2*i, i=0..255. Each row is None (unsolved) or a pair of primes summing to the target; equal primes are allowed. Maximize the fraction solved; every claimed pair is checked and any malformed claim invalidates the candidate. Construct prime pairs for 256 even targets from 1000000 to 1000510. These inputs are far within published verification ranges; maximizing coverage is a rediscovery exercise.

    Candidate interface: construct() -> 256 rows for even targets 1000000+2*i, i=0..255. Each row is None (unsolved) or a pair of primes summing to the target; equal primes are allowed. Maximize the fraction solved; every claimed pair is checked and any malformed claim invalidates the candidate.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
