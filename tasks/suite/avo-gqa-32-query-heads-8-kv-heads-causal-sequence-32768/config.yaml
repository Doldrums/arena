# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 1800
  max_retries: 2

prompt:
  system_message: |
    GQA 32 query heads 8 KV heads, causal, sequence 32768

    BF16 forward-prefill attention, head dimension 128, batch size 1, fixed 32768 total tokens.

    Candidate interface: attention(q, k, v, causal) -> torch.Tensor of shape (batch, heads_q, seq, dim): scaled dot-product attention in float32 on the CPU; k and v have heads_kv heads (grouped-query attention repeats each kv head for heads_q // heads_kv query heads); causal masks future positions. Score: achieved TFLOPS of the candidate (4*B*Hq*S*S*D flops, halved when causal) at the task's shapes, best of 3 timed runs after a warm-up; the output must match torch's scaled_dot_product_attention within 1e-3 relative error.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
