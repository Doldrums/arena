# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Traveling salesman constructive heuristic

    Traveling salesman constructive heuristic: optimize the candidate specified by the paper and evaluate against the named benchmark.

    Candidate interface: select_next_node(current_node, destination_node, unvisited_nodes: np.ndarray, distance_matrix: np.ndarray) -> int (EoH/LLM4AD contract). Score: mean tour length over generated Euclidean instances

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
