# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Triple systems on 16 points without the complete 3-partite K(2,2,2)

    construct() -> list of distinct triples [a, b, c] of distinct points in 0..15 such that no three disjoint pairs have all eight transversal triples present. Maximize the number of triples. A valid triple system with m triples certifies ex_3(16,K(2,2,2)) >= m; no finite value is documented.

    Candidate interface: construct() -> list of distinct triples [a, b, c] of distinct points in 0..15 such that no three disjoint pairs have all eight transversal triples present. Maximize the number of triples.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
