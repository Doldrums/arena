# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Binary error-correcting codes of length 17 and distance 6

    Construct the largest set of 17-bit words with pairwise Hamming distance at least 6, the extremal quantity A_2(17,6). Brouwer's table lists 258..340: the lower bound is Milshtein's 2019 nonlinear code, the upper bound comes from semidefinite programming. The 256-word linear reference is the [18,9,6] extended quadratic-residue code shortened by one coordinate; the seed has 32 words.

    Candidate interface: construct() -> nonempty list of distinct integers in [0, 2**N). Each integer encodes one N-bit binary codeword, including leading zeros. Every pair must have Hamming distance at least MINIMUM_DISTANCE. Linear and nonlinear codes are allowed. Score: number of codewords, maximized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
