# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Ambient integer sets with small largest Sidon subset

    Return exactly 12 distinct integers in [0,128]. Evaluator exhaustively computes the largest subset with all unordered pair sums unique INCLUDING diagonals. MINIMIZE that maximum subset size. The candidate chooses a hard AMBIENT set; the evaluator solves Sidon extraction exactly. This reverses the outer optimization compared with constructing a large Sidon set in a fixed interval.

    Candidate interface: construct() -> candidate. Return exactly 12 distinct integers in [0,128]. Evaluator exhaustively computes the largest subset with all unordered pair sums unique INCLUDING diagonals. MINIMIZE that maximum subset size.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
