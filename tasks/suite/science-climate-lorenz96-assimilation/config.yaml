# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Climate dynamics: partial-observation Lorenz-96 assimilation

    Design an ensemble analysis update that reconstructs an evolving twenty-variable chaotic state from noisy observations of half its coordinates. The evaluator propagates the ensemble and compares each updated ensemble mean with independent high-accuracy reference trajectories.

    Candidate interface: analyze(ensemble, observations, observed_indices, observation_variance) -> updated ensemble with the same (16,20) shape. Lorenz-96 dx_i/dt=(x_(i+1)-x_(i-2))*x_(i-1)-x_i+F with periodic indices, nondimensional units. Evaluator propagates each member by RK4 at dt=0.01 for five steps between updates, then observes even-indexed states with independent N(0,0.49) noise. Three runs F=6,8,10, seeds=181,283,389; 40 updates each. Score is pooled analysis-mean RMSE against independent DOP853 truth over all states and cycles. Output must be finite and within [-100,100]. Use assimilation_case with seeds=41,53,67 for development; no truth or future observations are provided to analyze.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
