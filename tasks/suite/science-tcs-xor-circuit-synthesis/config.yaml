# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Theoretical computer science: Exact XOR-circuit synthesis

    Exact XOR-circuit synthesis under a bounded candidate interface with independent verification; generated mathematical instances, no external dataset.

    Candidate interface: synthesize(matrix, depth_limit) -> {'gates': [[wire, wire], ...], 'outputs': [wire,...]}. Input wires are 0..n-1, constant-zero wire is n, gate k (zero-based) produces wire n+1+k. Exact symbolic GF(2) verification; depth <=16. Minimize mean gate-count / independent-row baseline over 8x8,12x16,16x16 binary maps.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
