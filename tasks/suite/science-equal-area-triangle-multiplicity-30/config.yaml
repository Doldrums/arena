# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Many equal-area triangles from 30 planar points

    construct() -> exactly 30 distinct integer coordinate pairs in [-30,30]^2. Compute the absolute determinant for every triple, exclude zero-area triples, and maximize the largest multiplicity of a single positive doubled area. The local bounded integer configurations give lower constructions for positive-area multiplicity; they do not reproduce the paper's asymptotic upper-bound proof.

    Candidate interface: construct() -> exactly 30 distinct integer coordinate pairs in [-30,30]^2. Compute the absolute determinant for every triple, exclude zero-area triples, and maximize the largest multiplicity of a single positive doubled area.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
