# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Graphs with 40 vertices and 401 edges whose largest book is small

    construct() -> exactly 401 distinct edges [u, v] on vertices 0..39. The score is the largest book: the maximum over edges of the number of triangles containing that edge. Minimize; the theorem of Edwards and Khadzhiivanov-Nikiforov gives score >= 40/6. For n = 40 and one edge above n^2/4 the theorem gives a book of size at least 7; the least achievable value for this finite size is not documented.

    Candidate interface: construct() -> exactly 401 distinct edges [u, v] on vertices 0..39. The score is the largest book: the maximum over edges of the number of triangles containing that edge. Minimize; the theorem of Edwards and Khadzhiivanov-Nikiforov gives score >= 40/6.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
