# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    GEOM molecular conformer ensemble search

    conformers(molecular_graph_smiles, stereochemistry, budget) -> K x N x 3 coordinates in Angstrom, N is RDKit AddHs atom order and 1<=K<=budget. Return bounded physically plausible conformers preserving all explicit stereocentres. Score molecular-macro GEOM heavy-atom symmetry-aware RMSD coverage at 0.5 Angstrom; matching RMSD is diagnostic. Evaluator checks bond distances, clashes and chirality against the molecular graph.

    Candidate interface: conformers(molecular_graph_smiles, stereochemistry, budget) -> K x N x 3 coordinates in Angstrom, N is RDKit AddHs atom order and 1<=K<=budget. Return bounded physically plausible conformers preserving all explicit stereocentres. Score molecular-macro GEOM heavy-atom symmetry-aware RMSD coverage at 0.5 Angstrom; matching RMSD is diagnostic. Evaluator checks bond distances, clashes and chirality against the molecular graph.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
