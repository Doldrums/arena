# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Path decompositions of three fixed connected graphs (Gallai's conjecture)

    construct() -> three lists of paths (vertex lists), one per fixed instance graph generated by instance_graph(n, p, seed) for (20,0.3,1), (25,0.3,2), (30,0.25,3) in the verifier. Paths must be simple, use graph edges, be edge-disjoint and cover all edges. Minimize the total number of paths; Gallai's conjecture predicts at most 10+13+15 = 38. The score is the total number of paths over three fixed random connected graphs; staying within 38 is consistent with the conjecture, exceeding it is not evidence against it.

    Candidate interface: construct() -> three lists of paths (vertex lists), one per fixed instance graph generated by instance_graph(n, p, seed) for (20,0.3,1), (25,0.3,2), (30,0.25,3) in the verifier. Paths must be simple, use graph edges, be edge-disjoint and cover all edges. Minimize the total number of paths; Gallai's conjecture predicts at most 10+13+15 = 38.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
