# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Cosmology: universal luminosity-distance quadrature

    Discover an eight-node positive quadrature rule for dimensionless luminosity distance in spatially flat, time-varying dark-energy models. The same nodes and weights must work across all models. Minimize the worst relative error against independent adaptive integration on disjoint public validation cosmologies. This is a locally designed synthetic numerical-method task reconstructed from published distance and CPL equations.

    Candidate interface: construct() -> {'nodes': length-8 real vector, 'weights': length-8 real vector}. Nodes must be strictly increasing in [0,1], weights positive and sum to 1 within 1e-12. One universal rule is used for every cosmology: dL/(c/H0) = (1+z)*z*sum_i weights[i]/E(a_i), where a_i=1/(1+z*nodes[i]) and E(a)=H(a)/H0. The evaluator computes integrands itself. Minimize worst relative validation error in percent; exactly eight integrand samples per distance.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
