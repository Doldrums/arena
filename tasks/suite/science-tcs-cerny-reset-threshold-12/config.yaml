# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Černý problem: 12-state binary automata with long reset thresholds

    Construct a complete deterministic automaton with 12 states and two input letters that synchronizes, maximizing the length of its shortest reset word. Breadth-first search on the subset automaton computes the exact threshold and returns a shortest word. This is a finite construction adaptation of JSP-000022; a finite high score cannot prove the universal Černý conjecture.

    Candidate interface: construct() -> two length-N lists of destination states in 0..N-1, defining a complete binary deterministic automaton. It must synchronize. Score is its EXACT shortest reset-word length, maximized. The evaluator exhaustively searches the subset automaton and reports a shortest word. Fixed N=12 is a local finite restriction, not a proof of Černý's general conjecture.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
