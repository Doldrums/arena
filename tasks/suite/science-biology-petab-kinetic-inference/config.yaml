# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: PEtab biochemical kinetic parameter inference

    Fit mechanistic biochemical ODE parameters from measured signaling trajectories and predict complete held-out stimulation conditions with an independent source-model solver.

    Candidate interface: fit_kinetics(petab_problem, training_objective, budget) -> {parameters,intervals}. problem includes parameter names, transformed bounds, initial_parameters, and training observations. Enforce bounds, finite intervals containing estimates, objective-call budget. Independently use pinned source-specific PEtab simulator on held-out whole conditions. No source-fitted held-out parameter values in candidate input.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
