# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Clique partitions of two fixed dense random graphs

    construct() -> two lists of cliques (vertex lists), one per instance from random_graph(n, p, seed) for (32,0.6,601) and (64,0.55,602) in the verifier (both with more than n^2/4 edges). Every listed set must be a clique with at least two vertices and every edge must lie in exactly one listed clique. Minimize the total number of cliques. The score totals clique partition sizes on two fixed dense graphs; it measures a partitioning method.

    Candidate interface: construct() -> two lists of cliques (vertex lists), one per instance from random_graph(n, p, seed) for (32,0.6,601) and (64,0.55,602) in the verifier (both with more than n^2/4 edges). Every listed set must be a clique with at least two vertices and every edge must lie in exactly one listed clique. Minimize the total number of cliques.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
