# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Flattest plus-minus-one polynomials with 24 coefficients (minimum sup norm)

    construct() -> 24 coefficients in {+1, -1} of P(z) = sum c_k z^k. The score is max over |z| = 1 of |P(z)| divided by sqrt(24), computed by dense sampling and golden-section refinement of the highest peaks (accuracy about 1e-9). Minimize; the exhaustive optimum is 1.2583758. The exact minimum for 24 coefficients (degree 23) is recovered; Odlyzko's online tables list the optimal polynomials.

    Candidate interface: construct() -> 24 coefficients in {+1, -1} of P(z) = sum c_k z^k. The score is max over |z| = 1 of |P(z)| divided by sqrt(24), computed by dense sampling and golden-section refinement of the highest peaks (accuracy about 1e-9). Minimize; the exhaustive optimum is 1.2583758.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
