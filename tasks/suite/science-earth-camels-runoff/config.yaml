# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth and environment: Measured rainfall–runoff transfer across catchments

    Calibrate a causal, water-conserving snow/soil runoff model on measured CAMELS catchments and predict discharge in wholly unseen basins and a subsequent year.

    Candidate interface: fit_runoff(training_basins) -> callable runoff(forcing_history,basin_attributes,state). Daily forcing columns[precipitation_mm,mean_temperature_C,solar_Wm2]. Output dict discharge_mm>=0,evapotranspiration_mm>=0,state with total storage_mm>=0. Enforce storage_previous+P-Q-ET=storage_new to1e-5mm. Retrospective current-day forcing only; full unseen-basin/year holdout. Basin-macro NSE, extremes and water-balance diagnostics.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
