# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth science: Groundwater predictive uncertainty

    Groundwater predictive uncertainty with an explicit candidate interface, physical units, independent evaluator and source-traceable observations or numerical model.

    Candidate interface: infer_aquifer(head_observations, geometry, forward_oracle, budget) -> 2..8samples of four positive multipliers[.5,2]: three conductivity layers and recharge. Actual MF6 6.7.0 source Freyberg model. Eight search forward calls per case; verification calls separately charged/reported. Minimize held-out-head Gaussian-mixture negative log predictive density, noise0.1m;90%interval coverage/width and mass balance diagnostics. Two explicitly synthetic aquifers, final stress-period observations withheld.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
