# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    NASICON occupation-dependent transport with exact finite-state reference

    transport(lattice, occupancies, barrier_model, temperature_k, budget) -> exactly budget['events'] [waiting_time_seconds, directed_edge_index] pairs. For the pinned NASICON model, Na state is0 and vacancy1; Si/P framework states remain fixed. barrier_model['nasicon_lce'] supplies occupation-dependent decorated LCE sums, source fitted parameters, local environments and directed periodic hop vectors. Rates are nu*exp(-(E_KRA+direction*DeltaE_site/2)/(kBT)). Preserve particle identity, exclusion and unwrapped periodic displacement. Evaluator independently audits clocks/events and compares 1000-event mean tagged-ion MSD/(6 mean physical time) against exact propagation over1680 tagged states. Score candidate runtime*relative_standard_error^2 across64 replicas. This bounded source illustrative model does not establish bulk/asymptotic conductivity or a new validated material fit.

    Candidate interface: transport(lattice, occupancies, barrier_model, temperature_k, budget) -> exactly budget['events'] [waiting_time_seconds, directed_edge_index] pairs. For the pinned NASICON model, Na state is0 and vacancy1; Si/P framework states remain fixed. barrier_model['nasicon_lce'] supplies occupation-dependent decorated LCE sums, source fitted parameters, local environments and directed periodic hop vectors. Rates are nu*exp(-(E_KRA+direction*DeltaE_site/2)/(kBT)). Preserve particle identity, exclusion and unwrapped periodic displacement. Evaluator independently audits clocks/events and compares 1000-event mean tagged-ion MSD/(6 mean physical time) against exact propagation over1680 tagged states. Score candidate runtime*relative_standard_error^2 across64 replicas. This bounded source illustrative model does not establish bulk/asymptotic conductivity or a new validated material fit.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
