# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Long intervals containing no modular inverse pair

    Return [start,length] for a nonempty interval contained in [1,1008]. For EVERY x,y in the interval, including x=y, require x*y %1009 !=1. Maximize interval length. Finite obstruction search for the modular inverse-pair interval question. Diagonal pairs are checked, so the self-inverse residues1 and1008 cannot be present; this is stricter than the preliminary distinct-pair proposal.

    Candidate interface: construct() -> candidate. Return [start,length] for a nonempty interval contained in [1,1008]. For EVERY x,y in the interval, including x=y, require x*y %1009 !=1. Maximize interval length.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
