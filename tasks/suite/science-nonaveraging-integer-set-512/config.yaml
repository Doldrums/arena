# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large sets without subset averages

    construct() -> 1..maximum=48 distinct positive integers <=n=512. No element may be the exact arithmetic mean of any subset of at least two OTHER elements. The verifier checks every possible subset cardinality by integer bitsets. Maximize cardinality. At most 48 integers in [1,512], with no element the mean of any subset of at least two distinct OTHER elements. Exact subset-sum dynamic programming verifies all subset sizes.

    Candidate interface: construct() -> 1..maximum=48 distinct positive integers <=n=512. No element may be the exact arithmetic mean of any subset of at least two OTHER elements. The verifier checks every possible subset cardinality by integer bitsets. Maximize cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
