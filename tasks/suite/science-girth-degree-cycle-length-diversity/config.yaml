# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Few cycle lengths under degree and girth constraints

    construct() -> undirected simple edges on vertices 0..11. Every vertex must have degree at least three and every simple cycle must have length at least four. Enumerating every simple cycle, the evaluator minimizes the number of distinct cycle lengths. Disconnected graphs are allowed by the source problem. The local n=12 minimum-degree-three condition is stronger than the paper’s average-degree-three hypothesis. Exhaustive cycles prove the local score, without proving any general lower bound or current extremal record.

    Candidate interface: construct() -> undirected simple edges on vertices 0..11. Every vertex must have degree at least three and every simple cycle must have length at least four. Enumerating every simple cycle, the evaluator minimizes the number of distinct cycle lengths. Disconnected graphs are allowed by the source problem.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
