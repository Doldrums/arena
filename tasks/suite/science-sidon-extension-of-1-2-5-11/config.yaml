# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Extending the Sidon set {1, 2, 5, 11} inside [1, 284]

    construct() -> distinct integers in 1..284 containing 1, 2, 5 and 11 whose pairwise sums a + b (a <= b) are all distinct. Maximize the size; without the prescribed elements the maximum in [1, 284] is 20 (the optimal 20-mark Golomb ruler has length 283). Scores near 20 would show that the prescribed elements barely reduce the attainable size at this scale; no value for this seed is documented.

    Candidate interface: construct() -> distinct integers in 1..284 containing 1, 2, 5 and 11 whose pairwise sums a + b (a <= b) are all distinct. Maximize the size; without the prescribed elements the maximum in [1, 284] is 20 (the optimal 20-mark Golomb ruler has length 283).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
