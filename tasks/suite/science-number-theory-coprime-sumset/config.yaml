# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large pairwise-coprime sumsets of two bounded integer sets

    Return two lists A,B, each containing exactly 3 distinct integers in [1,128]. All DISTINCT values in A+B must be pairwise coprime. Maximize the cardinality of A+B; repeated representations are allowed. Finite construction model for the Straus sumset-density question. Three elements per summand set and the bounding box are local; finite cardinality does not establish infinite density.

    Candidate interface: construct() -> candidate. Return two lists A,B, each containing exactly 3 distinct integers in [1,128]. All DISTINCT values in A+B must be pairwise coprime. Maximize the cardinality of A+B; repeated representations are allowed.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
