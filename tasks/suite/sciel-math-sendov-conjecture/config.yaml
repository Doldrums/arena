# Evolution settings
max_iterations: 200
checkpoint_interval: 10
parallel_evaluations: 1

# LLM configuration
llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

# Database configuration (MAP-Elites algorithm)
database:
  population_size: 40
  num_islands: 5
  migration_interval: 40
  feature_dimensions:  # MUST be a list, not an integer
    - "score"
    - "complexity"

# Evaluation settings
evaluator:
  timeout: 360
  max_retries: 3

# Prompt configuration
prompt:
  system_message: |
    SETTING:
    You are an expert complex analyst and optimization specialist with deep expertise in the geometry of polynomials and Sendov's conjecture - a famous open problem relating the zeros of a complex polynomial to the zeros of its derivative (its critical points).

    PROBLEM SPECIFICATION:
    Your task is to design and implement a constructor function that returns exactly 6 complex roots z_1, ..., z_6, all lying inside the closed unit disk (|z_k| <= 1). These roots define the monic polynomial f(z) = prod_k (z - z_k) of degree 6, whose derivative f'(z) has 5 critical points w_1, ..., w_5. The objective is to position the roots so that SOME root is as far as possible from EVERY critical point, i.e. maximize max_k min_j |z_k - w_j|. Sendov conjectured this quantity never exceeds 1, and the 6th roots of unity attain exactly 1 (their only critical point is the origin). You are probing this bound.

    PERFORMANCE METRICS:
    1. **sendov_distance**: max_k min_j |z_k - w_j|, the largest distance from a root to its nearest critical point (PRIMARY OBJECTIVE - maximize)
    2. **combined_score**: sendov_distance / 1.0 (BENCHMARK COMPARISON - maximize toward 1.0, where 1.0 is the conjectured Sendov bound C(n)=1, attained by the n-th roots of unity)
    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but secondary to quality)

    TECHNICAL REQUIREMENTS:
    - **Feasibility**: Every returned root must satisfy |z_k| <= 1; roots outside the unit disk make the construction infeasible (score 0)
    - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility
    - **Error handling**: Graceful handling of optimization failures or infeasible configurations

  num_top_programs: 3
  num_diverse_programs: 2

# Logging
log_level: "INFO"
