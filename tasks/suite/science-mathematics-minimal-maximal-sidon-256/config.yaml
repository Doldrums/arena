# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 30
  max_retries: 2

prompt:
  system_message: |
    Small inclusion-maximal Sidon sets in [1,256]

    Construct a Sidon subset of the integer interval [1,256] that cannot be extended by any other interval element, and minimize its cardinality. The verifier checks every unordered pair sum including diagonal pairs and tries every missing element. This is the N=256 instance of the minimal-size maximal-set problem listed as JSP-000154, distinct from the existing maximum-cardinality Sidon-set task.

    Candidate interface: construct() -> a nonempty list of distinct Python integers in [1,N]. All unordered sums a+b with a<=b must be distinct INCLUDING a=a. Adding ANY missing integer from [1,N] must destroy this property. Minimize cardinality. Fixed N=256 is a finite adaptation of the small maximal Sidon-set problem; maximal means inclusion-maximal, not maximum cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
