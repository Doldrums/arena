# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Integer sum-product extremal sets

    construct() -> n=20 distinct positive integers <=maximum=10000. Compute A+A and A*A with equal summands/factors allowed. Minimize max(|A+A|,|A*A|). Exactly 20 distinct positive integers at most 10000, minimizing the maximum of sumset and product-set sizes. This uses integers rather than arbitrary reals, and includes diagonal pairs.

    Candidate interface: construct() -> n=20 distinct positive integers <=maximum=10000. Compute A+A and A*A with equal summands/factors allowed. Minimize max(|A+A|,|A*A|).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
