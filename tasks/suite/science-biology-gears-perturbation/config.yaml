# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Perturb-seq response generalization

    Predict expression shifts for complete held-out genetic perturbations using measured GEARS study pseudobulks and training-only gene selection.

    Candidate interface: predict_shift(training_profiles, training_perturbations, query_perturbations, gene_context) -> finite query x gene matrix of expression shifts relative to controls. Whole perturbation groups are disjoint. Minimize query MSE divided by error of training-perturbation-mean baseline; report mean-reference-corrected perturbation retrieval.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
