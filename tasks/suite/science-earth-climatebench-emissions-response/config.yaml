# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Earth and environment: ClimateBench emissions-to-climate response

    Learn a compact emissions-response emulator from complete training scenarios and predict source climate anomalies for the entirely withheldSSP245 scenario.

    Candidate interface: fit_climate(training_scenarios,grid) -> model.project_climate(forcing_history) returning declared year x latitude x longitude fields. Input named columns cumulativeCO2,CH4,globalSO2,globalBC. NorESM source climate anomalies, tas inK and precipitation inmm/day. Complete SSP245 withheld; score2080–2100 using cos(latitude)-weighted spatialNRMSE+5*globalNRMSE, then mean variables. Four-variable full leaderboard not claimed for two-variable coarse subset.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
