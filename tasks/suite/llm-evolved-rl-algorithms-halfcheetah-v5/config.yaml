# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 900
  max_retries: 2

prompt:
  system_message: |
    HalfCheetah-v5

    HalfCheetah-v5 task evaluated in Evolutionary Discovery of Reinforcement Learning Algorithms via Large Language Models.

    Candidate interface: class Agent(observation_space, action_space, seed) with act(observation, explore) and observe(observation, action, reward, next_observation, terminated, truncated). Score: mean evaluation return after a fixed training budget on the Gymnasium task

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
