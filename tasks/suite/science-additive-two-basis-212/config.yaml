# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Smallest set whose pairwise sums cover 0..212

    construct() -> distinct integers in 0..212 such that every integer 0..212 equals a + b for some a <= b in the set (a = b allowed). Minimize the size; the optimum is 25. For n = 212 the minimum is 25, so the task recovers an extremal basis.

    Candidate interface: construct() -> distinct integers in 0..212 such that every integer 0..212 equals a + b for some a <= b in the set (a = b allowed). Minimize the size; the optimum is 25.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
