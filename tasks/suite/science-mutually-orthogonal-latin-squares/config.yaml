# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Mutually orthogonal Latin squares of order ten

    construct() -> a nonempty list of 10-by-10 arrays with Python integer symbols 0..9. Every row and column must contain each symbol exactly once. For every two arrays, their 100 ordered symbol pairs must be distinct. Maximize the number of pairwise orthogonal arrays. Only order ten is evaluated. The cyclic single-square baseline does not implement Wilson’s recursive constructions. No current best-known N(10), global optimality or novel family is asserted.

    Candidate interface: construct() -> a nonempty list of 10-by-10 arrays with Python integer symbols 0..9. Every row and column must contain each symbol exactly once. For every two arrays, their 100 ordered symbol pairs must be distinct. Maximize the number of pairwise orthogonal arrays.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
