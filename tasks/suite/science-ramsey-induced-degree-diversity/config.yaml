# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Many distinct induced degrees in a Ramsey host

    construct() -> distinct vertices of the pinned 17-vertex graph, selecting at least eight. Maximize the number of distinct vertex degrees in the induced subgraph. The evaluator checks that the host has no clique or independent set of size four. The input is the classical Paley graph of order 17, and at least eight vertices must be retained. The published theorem concerns growing hosts and unspecified constants; no asymptotic or optimality claim follows from this instance.

    Candidate interface: construct() -> distinct vertices of the pinned 17-vertex graph, selecting at least eight. Maximize the number of distinct vertex degrees in the induced subgraph. The evaluator checks that the host has no clique or independent set of size four.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
