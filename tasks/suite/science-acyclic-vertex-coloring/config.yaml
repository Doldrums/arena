# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Few colors without any bicolored cycle

    construct() -> fifty Python integer color labels in 0..49 for the pinned degree-four graph. Adjacent vertices must differ and the subgraph induced by any two colors must be a forest. Minimize number of distinct colors; union-find detects bicolored cycles exactly. A fixed 50-vertex degree-four circulant graph with steps 1 and 7 is colored. A lower score is a better finite coloring, not a new general maximum-degree bound.

    Candidate interface: construct() -> fifty Python integer color labels in 0..49 for the pinned degree-four graph. Adjacent vertices must differ and the subgraph induced by any two colors must be a forest. Minimize number of distinct colors; union-find detects bicolored cycles exactly.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
