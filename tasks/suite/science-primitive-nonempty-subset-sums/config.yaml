# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large sets with divisibility-incomparable subset sums

    construct() -> 1..30 distinct integers in 1..256. Form every NONEMPTY subset sum; no two distinct resulting values may divide one another. Equal sum values are deduplicated (but any repeated subset representation also leads to a forbidden double after cancellation). Maximize set size. The local N=256 construction is checked by exact reachability and a multiples sieve. The empty sum is excluded, and no general asymptotic improvement or formal proof is claimed.

    Candidate interface: construct() -> 1..30 distinct integers in 1..256. Form every NONEMPTY subset sum; no two distinct resulting values may divide one another. Equal sum values are deduplicated (but any repeated subset representation also leads to a forbidden double after cancellation). Maximize set size.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
