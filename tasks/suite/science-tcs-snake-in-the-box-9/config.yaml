# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Snake-in-the-box in the 9-dimensional hypercube

    Construct the longest induced path (snake) in the hypercube Q_9: a sequence of distinct 9-bit vertices in which consecutive vertices differ in one bit and non-consecutive vertices differ in at least two bits. The exact maximum is known only up to dimension 8 (98 in Q_8); in dimension 9 the best known snakes had length 190 before 2026 and were improved in arXiv:2607.15270, so the problem is open. The seed is a greedy snake of length 104.

    Candidate interface: construct() -> list of distinct integers in [0, 2**N): the vertices of an induced path in the hypercube Q_N in order. Consecutive vertices differ in exactly one bit; non-consecutive vertices differ in at least two bits. Score: number of edges, maximized.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
