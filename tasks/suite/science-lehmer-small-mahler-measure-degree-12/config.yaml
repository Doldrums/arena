# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Smallest Mahler measure above one in degree at most 12 (Lehmer's problem)

    construct() -> integer coefficients [c_0, ..., c_d] (constant term first) with 1 <= d <= 12, |c_i| <= 3 and c_d != 0. Polynomials equal to +-x^k times a product of cyclotomic polynomials (measure exactly one) are rejected by exact polynomial division. The score is the Mahler measure |c_d| * prod max(1, |z|) over all complex roots z (Aberth iteration, reported to 10 decimals). Minimize; the optimum is Lehmer's number 1.1762808183. Among integer polynomials of degree at most 12 the least measure above one is Lehmer's number, so the task recovers Lehmer's polynomial (up to sign, reversal and cyclotomic factors).

    Candidate interface: construct() -> integer coefficients [c_0, ..., c_d] (constant term first) with 1 <= d <= 12, |c_i| <= 3 and c_d != 0. Polynomials equal to +-x^k times a product of cyclotomic polynomials (measure exactly one) are rejected by exact polynomial division. The score is the Mahler measure |c_d| * prod max(1, |z|) over all complex roots z (Aberth iteration, reported to 10 decimals). Minimize; the optimum is Lehmer's number 1.1762808183.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
