# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Sparse pancyclic graphs on 40 vertices

    construct() -> {'edges': undirected edge pairs on vertices 0..39, 'cycles': one vertex-list cycle of every length 3..40 in that order}. Edges are simple and distinct; cycle vertices are distinct and every required edge must exist. Minimize edge count minus 40. This is an independently implemented n=40 construction search with explicit cycle certificates. The seed is an elementary fan graph, not a copied minimal construction.

    Candidate interface: construct() -> {'edges': undirected edge pairs on vertices 0..39, 'cycles': one vertex-list cycle of every length 3..40 in that order}. Edges are simple and distinct; cycle vertices are distinct and every required edge must exist. Minimize edge count minus 40.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
