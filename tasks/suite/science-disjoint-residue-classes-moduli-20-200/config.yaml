# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Pairwise disjoint residue classes with distinct moduli in [20, 200] (largest reciprocal sum)

    construct() -> classes [[m, r], ...] with distinct moduli 20 <= m <= 200 and 0 <= r < m, pairwise disjoint (r_1 != r_2 modulo gcd(m_1, m_2)). The score is the sum of 1/m (exact rational, reported as a float). Maximize. With moduli restricted to [20, 200] every valid construction bounds epsilon_19 from below.

    Candidate interface: construct() -> classes [[m, r], ...] with distinct moduli 20 <= m <= 200 and 0 <= r < m, pairwise disjoint (r_1 != r_2 modulo gcd(m_1, m_2)). The score is the sum of 1/m (exact rational, reported as a float). Maximize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
