# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Quantum information: shallow-circuit Ising ground states

    Optimize parameters of a fixed three-layer Ry/CZ circuit to approximate ground states of open transverse-field Ising chains. The evaluator builds each state itself and minimizes the mean energy gap per spin relative to an independent exact eigensolution.

    Candidate interface: angles(n, coupling, field, layers) -> finite real array (layers,n) in radians. H=-coupling*sum Z_i Z_(i+1)-field*sum X_i, open chain, qubit i is bit i. Start |0>^n; each layer applies Ry(theta) to every qubit; between layers apply CZ on every adjacent pair in ascending order. No entangler after final layer. Fixed layers=3, n=4,6, coupling=1, fields=0.45,1,1.65. Objective: mean (circuit energy - exact ground energy)/n. Development fields: 0.3,0.8,1.4. Return circuit parameters, not a statevector or reported energy.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
