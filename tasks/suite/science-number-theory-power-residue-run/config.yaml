# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Early runs of five quadratic residues modulo1009

    Return {'start':s,'roots':[r0,...,r4]}, with 1<=s<=1004 and 1<=ri<=1008. Require ri**2 mod 1009 == s+i. Minimize s; zero residues and wraparound are excluded. A fixed-prime instance of the least run-start r(k,m,p), with k=2 and m=5. Each residue is certified by its root; no limsup over primes is computed.

    Candidate interface: construct() -> candidate. Return {'start':s,'roots':[r0,...,r4]}, with 1<=s<=1004 and 1<=ri<=1008. Require ri**2 mod 1009 == s+i. Minimize s; zero residues and wraparound are excluded.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
