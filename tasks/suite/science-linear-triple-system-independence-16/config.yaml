# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Linear triple systems on 16 points with small independence number

    construct() -> list of triples [a, b, c] on points 0..15 in which any two triples share at most one point. The score is the largest point set containing no triple (checked over all subsets). Minimize. A valid system with independence number a certifies f(16) <= a; no finite value is documented.

    Candidate interface: construct() -> list of triples [a, b, c] on points 0..15 in which any two triples share at most one point. The score is the largest point set containing no triple (checked over all subsets). Minimize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
