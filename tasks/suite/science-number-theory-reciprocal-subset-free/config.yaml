# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large reciprocal-subsum-free sets

    Return a nonempty subset of [1,24]; no reciprocal of a selected element may equal the sum of reciprocals of a subset of the OTHER selected elements. Maximize cardinality. Finite version of the extremal S* question; operands are distinct selected elements and the target is excluded from its own subsum.

    Candidate interface: construct() -> candidate. Return a nonempty subset of [1,24]; no reciprocal of a selected element may equal the sum of reciprocals of a subset of the OTHER selected elements. Maximize cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
