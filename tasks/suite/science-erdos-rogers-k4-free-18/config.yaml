# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    K4-free graphs on 18 vertices with small triangle-free induced subgraphs (Erdős-Rogers)

    construct() -> list of edges [u, v] of a simple K4-free graph on vertices 0..17. The score is the largest number of vertices inducing a triangle-free subgraph (exact branch and bound). Minimize. A K4-free graph whose triangle-free induced subgraphs have at most s vertices certifies f(18) <= s; no exact value for n = 18 is documented.

    Candidate interface: construct() -> list of edges [u, v] of a simple K4-free graph on vertices 0..17. The score is the largest number of vertices inducing a triangle-free subgraph (exact branch and bound). Minimize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
