# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Approximate a ratio inside a divisor-sum fiber

    construct() -> [a,b], positive Python integers <=10000000. Require sigma(a)=sigma(b), where sigma includes ALL positive divisors. Minimize |a/b-3/2|. Factorization and rational error are exact; the score is the binary64 serialization of that rational, with its exact numerator/denominator reported. Only the target 3/2 and inputs bounded by ten million are evaluated. A smaller exact rational error is a finite approximation, not a density proof for all positive real targets. Tiny error differences can round to the same floating score.

    Candidate interface: construct() -> [a,b], positive Python integers <=10000000. Require sigma(a)=sigma(b), where sigma includes ALL positive divisors. Minimize |a/b-3/2|. Factorization and rational error are exact; the score is the binary64 serialization of that rational, with its exact numerator/denominator reported.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
