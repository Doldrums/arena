# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Earth science: Water-efficient irrigation policies

    Water-efficient irrigation policies with an explicit candidate interface, physical units, independent evaluator and source-traceable observations or numerical model.

    Candidate interface: irrigate(observed_weather_history, soil_state, crop_stage, remaining_water) -> irrigation mm. AquaCrop-OSPy3.0.12 wheat on Tunis1981/82,1983/84,1985/86 and SandyLoam/ClayLoam. API reveals only past weather and current soil; daily<=25mm, seasonal<=150mm. Maximize mean simulated dry yield tonnes/ha; independent simulator tracks actual water. No salinity/fertility/weed stress or measured field-benefit claim.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
