# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Cantera chemical-mechanism reduction

    reduce_mechanism(full_mechanism, training_conditions, tolerance) -> {'species': unique species-name list, 'reaction_indices': unique integer list}. Full mechanism provides canonical Cantera 3.2 h2o2 YAML, species, reaction equations, and required_species. Retain only original species thermochemistry and original reactions; independent Cantera validates balance. Three withheld temperature/pressure/equivalence-ratio cases compare temperature, H2/O2/H2O/OH histories and sampled ignition delay. Worst normalized error must be <=0.05. Score 1 - 0.5*(retained species fraction + retained reaction fraction). This is reference-mechanism agreement, not experimental validation.

    Candidate interface: reduce_mechanism(full_mechanism, training_conditions, tolerance) -> {'species': unique species-name list, 'reaction_indices': unique integer list}. Full mechanism provides canonical Cantera 3.2 h2o2 YAML, species, reaction equations, and required_species. Retain only original species thermochemistry and original reactions; independent Cantera validates balance. Three withheld temperature/pressure/equivalence-ratio cases compare temperature, H2/O2/H2O/OH histories and sampled ignition delay. Worst normalized error must be <=0.05. Score 1 - 0.5*(retained species fraction + retained reaction fraction). This is reference-mechanism agreement, not experimental validation.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
