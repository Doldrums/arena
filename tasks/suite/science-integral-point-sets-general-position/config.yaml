# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Integral point sets in general position (no three collinear, no four concyclic)

    construct() -> {'D': D, 'points': [[[x_num, x_den], [y_num, y_den]], ...]} describing 3 to 12 distinct points (x, y*sqrt(D)) with rational x, y (|numerators|, denominators <= 10^40) and squarefree D <= 10^12. All pairwise distances must be rational (equivalently integral after scaling), no three points collinear and no four concyclic, all checked with exact rational arithmetic. Maximize the number of points. A valid set certifies such configurations of that size; 8 points would be new.

    Candidate interface: construct() -> {'D': D, 'points': [[[x_num, x_den], [y_num, y_den]], ...]} describing 3 to 12 distinct points (x, y*sqrt(D)) with rational x, y (|numerators|, denominators <= 10^40) and squarefree D <= 10^12. All pairwise distances must be rational (equivalently integral after scaling), no three points collinear and no four concyclic, all checked with exact rational arithmetic. Maximize the number of points.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
