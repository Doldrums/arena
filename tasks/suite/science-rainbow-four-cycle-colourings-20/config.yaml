# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Dense graphs on 20 vertices edge-coloured with 20 colours so every 4-cycle is rainbow

    construct() -> coloured edges [[u, v, c], ...] of a simple graph on vertices 0..19 with colours 0..19. Every 4-cycle (as a subgraph) must receive four distinct colours, checked over all 4-cycles. Maximize the number of edges. Dense valid colourings for n = 20 are finite evidence on the anti-Ramsey question.

    Candidate interface: construct() -> coloured edges [[u, v, c], ...] of a simple graph on vertices 0..19 with colours 0..19. Every 4-cycle (as a subgraph) must receive four distinct colours, checked over all 4-cycles. Maximize the number of edges.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
