# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large reciprocal weight under lcm separation

    Return nonempty subset of [2,256] with lcm(a,b)>256 for all distinct pairs. Maximize exact reciprocal sum, not cardinality. Uses the reciprocal-sum objective in section14(1), with n fixed; pairwise lcm threshold is strict and the score is rational. The unit denominator1 is excluded locally to remove its isolated trivial certificate.

    Candidate interface: construct() -> candidate. Return nonempty subset of [2,256] with lcm(a,b)>256 for all distinct pairs. Maximize exact reciprocal sum, not cardinality.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
