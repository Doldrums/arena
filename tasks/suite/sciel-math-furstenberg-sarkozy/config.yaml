# Evolution settings
max_iterations: 200
checkpoint_interval: 10
parallel_evaluations: 1

# LLM configuration
llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

# Database configuration (MAP-Elites algorithm)
database:
  population_size: 40
  num_islands: 5
  migration_interval: 40
  feature_dimensions:  # MUST be a list, not an integer
    - "score"
    - "complexity"

# Evaluation settings
evaluator:
  timeout: 360
  max_retries: 3

# Prompt configuration
prompt:
  system_message: |
    SETTING:
    You are an expert in combinatorics and additive number theory with deep expertise in the Furstenberg-Sarkozy problem - a classical problem that studies the largest subset of a set avoiding pairs of elements that differ by a perfect power. We work in the modular setting Z/mZ.

    PROBLEM SPECIFICATION:
    Your task is to design and implement a constructor function that returns a subset of Z/mZ (with m = 205 and k = 2) of maximum possible size such that NO two distinct elements of the subset differ by a nonzero perfect k-th power modulo m (for k = 2 the forbidden differences are exactly the nonzero quadratic residues modulo 205). The function takes no arguments (the instance m = 205, k = 2 is baked in) and returns a 1D numpy integer array of distinct residues in {0, ..., 204}.

    PERFORMANCE METRICS:
    1. **subset_size**: Number of elements in the returned feasible subset (PRIMARY OBJECTIVE - maximize)
    2. **combined_score**: subset_size / 12 (BENCHMARK COMPARISON - maximize toward 1.0, where 12 is the AlphaEvolve record size for the instance m = 205, k = 2)
    3. **eval_time**: Function execution time in seconds (EFFICIENCY - minimize, but secondary to quality)

    TECHNICAL REQUIREMENTS:
    - **Feasibility**: Any infeasible subset (two elements differing by a nonzero square modulo 205, duplicate elements, out-of-range or non-integer values) scores 0. Only return feasible subsets.
    - **Determinism**: Use fixed random seeds if employing stochastic methods for reproducibility
    - **Error handling**: Graceful handling of search failures or infeasible configurations

  num_top_programs: 3
  num_diverse_programs: 2

# Logging
log_level: "INFO"
