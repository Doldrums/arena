# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Smallest triangle-free graph of chromatic number five (rediscovering 22 vertices)

    construct() -> {'n': n, 'edges': [[u, v], ...]}: a simple triangle-free graph on vertices 0..n-1 with 1 <= n <= 23 that is not 4-colourable (exact backtracking). Minimize n; the proven optimum is 22. Any valid graph certifies h_3(5) <= n; the optimum 22 was established by exhaustive computer search.

    Candidate interface: construct() -> {'n': n, 'edges': [[u, v], ...]}: a simple triangle-free graph on vertices 0..n-1 with 1 <= n <= 23 that is not 4-colourable (exact backtracking). Minimize n; the proven optimum is 22.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
