# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Small largest prime factor of consecutive-integer products

    Return integer n in [10000,1000000]. Minimize the largest prime factor of n(n+1), independently computed by exact trial division. Searches a bounded window for smooth consecutive integers. The local lower cutoff prevents the trivial pair1,2; it proves no asymptotic bound.

    Candidate interface: construct() -> candidate. Return integer n in [10000,1000000]. Minimize the largest prime factor of n(n+1), independently computed by exact trial division.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
