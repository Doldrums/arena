# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Families of subsets of an 8-set with no two members meeting in exactly 2 elements

    construct() -> distinct subsets of {1, ..., 8} (lists of elements) such that no two distinct members intersect in exactly 2 elements. Maximize the number of subsets; the optimum is T(8,2) = 67. For n = 8 and r = 2 the optimum is 67, so the task recovers an extremal family.

    Candidate interface: construct() -> distinct subsets of {1, ..., 8} (lists of elements) such that no two distinct members intersect in exactly 2 elements. Maximize the number of subsets; the optimum is T(8,2) = 67.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
