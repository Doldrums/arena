# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 300
  max_retries: 2

prompt:
  system_message: |
    CaloChallenge photon shower generation

    fit_showers(training) -> sampler(incident_energies, rng). Training contains showers, incident_energies and voxel geometry from official CaloChallenge Dataset 1 photons. Return nonnegative (event,voxel) deposits in MeV. Independent source-file events are held out. Score per-energy standardized Wasserstein of shower response, sparsity, layer fractions, centroids and widths. Classifier AUC and generation time are separate diagnostics. Compact CPU adaptation, not full challenge leaderboard.

    Candidate interface: fit_showers(training) -> sampler(incident_energies, rng). Training contains showers, incident_energies and voxel geometry from official CaloChallenge Dataset 1 photons. Return nonnegative (event,voxel) deposits in MeV. Independent source-file events are held out. Score per-energy standardized Wasserstein of shower response, sparsity, layer fractions, centroids and widths. Classifier AUC and generation time are separate diagnostics. Compact CPU adaptation, not full challenge leaderboard.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
