# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Small tournaments in which every four vertices have a common dominator (Schütte's problem, k = 4)

    construct() -> {'n': n, 'orientation': [...]}: one bit per pair (i,j), i<j, of vertices 0..n-1 in lexicographic order (0 means i -> j, 1 means j -> i), 5 <= n <= 90. Every set of 4 vertices must have a vertex with arcs to all four. Minimize n. A valid tournament on n vertices certifies f(4) <= n. The smallest known has 67 vertices; Erdős's lower bound gives f(4) >= 31.

    Candidate interface: construct() -> {'n': n, 'orientation': [...]}: one bit per pair (i,j), i<j, of vertices 0..n-1 in lexicographic order (0 means i -> j, 1 means j -> i), 5 <= n <= 90. Every set of 4 vertices must have a vertex with arcs to all four. Minimize n.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
