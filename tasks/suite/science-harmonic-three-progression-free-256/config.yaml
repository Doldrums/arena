# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Reciprocal weight of three-progression-free sets

    construct() -> a nonempty subset of [1,n=256] without any nonconstant k=3 term arithmetic progression. Maximize the exact sum of reciprocals; score is its floating serialization with exact numerator/denominator in details. A bounded subset of [1,256] without three-term progressions, scored by reciprocal weight. It does not settle the general all-length divergent-reciprocal-sum question.

    Candidate interface: construct() -> a nonempty subset of [1,n=256] without any nonconstant k=3 term arithmetic progression. Maximize the exact sum of reciprocals; score is its floating serialization with exact numerator/denominator in details.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
