# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Triangle-free diameter-four augmentation

    construct() -> list of added undirected edges [u,v] on vertices 0..23. Existing edges and duplicate edges are forbidden. The union with the pinned path must remain triangle-free, connected and have diameter at most four. Minimize the number of added edges. The host is a locally chosen 24-vertex path. Its h_4 upper bounds do not establish the maximum over all triangle-free hosts or the paper’s asymptotic claims.

    Candidate interface: construct() -> list of added undirected edges [u,v] on vertices 0..23. Existing edges and duplicate edges are forbidden. The union with the pinned path must remain triangle-free, connected and have diameter at most four. Minimize the number of added edges.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
