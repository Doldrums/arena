# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Biology: Eterna RNA inverse folding

    Search for RNA sequences whose independently evaluated minimum-free-energy structures match Eterna100-v2 targets under a folding-call budget.

    Candidate interface: design(dot_bracket, constraints, oracle) -> ACGU sequence of matching length. constraints uses N for free bases. oracle(sequence) returns (MFE_structure,energy), exposes budget, and rejects calls beyond budget. ViennaRNA 2.6.4, 37 C. Objective fraction of exact deterministic MFE matches. Search runs in trusted protocol (direct engine calls cannot be policed in-process).

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
