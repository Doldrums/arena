# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 600
  max_retries: 2

prompt:
  system_message: |
    Grouped-SPMe battery electrochemical inversion

    infer_parameters(training_protocols, forward_model, bounds, budget) -> dictionary of exactly the grouped physical parameters in bounds. forward_model(parameters, protocol) is an evaluator-owned pinned PyBOP GroupedSPMe solve; at most 100 training calls. Independent held-out whole-SOC impedance and time-domain protocols score mean normalized complex impedance/voltage RMSE. Enforce physical parameter bounds; uncertainty/identifiability is not inferred from a point estimate. The trusted source adapter must be SHA-256 pinned and may not be candidate-supplied.

    Candidate interface: infer_parameters(training_protocols, forward_model, bounds, budget) -> dictionary of exactly the grouped physical parameters in bounds. forward_model(parameters, protocol) is an evaluator-owned pinned PyBOP GroupedSPMe solve; at most 100 training calls. Independent held-out whole-SOC impedance and time-domain protocols score mean normalized complex impedance/voltage RMSE. Enforce physical parameter bounds; uncertainty/identifiability is not inferred from a point estimate. The trusted source adapter must be SHA-256 pinned and may not be candidate-supplied.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
