# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Large sets with cardinality-separated subset sums

    construct() -> 1..60 distinct integers in 1..256. Whenever two subsets have different cardinalities their sums must differ. Repeated sums within the SAME cardinality are allowed. The empty subset is included. Maximize set size using exact cardinality-indexed subset-sum dynamic programming. N=256 with at most sixty output members is a bounded finite instance. This is weaker than requiring all subset sums distinct and is intentionally a different task. No optimality or infinite-density conclusion follows.

    Candidate interface: construct() -> 1..60 distinct integers in 1..256. Whenever two subsets have different cardinalities their sums must differ. Repeated sums within the SAME cardinality are allowed. The empty subset is included. Maximize set size using exact cardinality-indexed subset-sum dynamic programming.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
