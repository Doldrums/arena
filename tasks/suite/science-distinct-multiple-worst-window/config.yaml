# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Worst interval starts for distinct-multiple matching

    construct() -> Python integer m in 0..1000000. The evaluator computes f(12,m), the LEAST positive L such that (m,m+L] contains distinct b_1,...,b_12 with i dividing b_i. Maximize this independently computed L. Exact bipartite matching plus monotone binary search evaluates every proposal. The task fixes n=12 and bounds m by one million; it optimizes the exact finite f(n,m). It neither searches arbitrary integer sets as in JSP-000578 nor establishes asymptotic worst-case growth.

    Candidate interface: construct() -> Python integer m in 0..1000000. The evaluator computes f(12,m), the LEAST positive L such that (m,m+L] contains distinct b_1,...,b_12 with i dividing b_i. Maximize this independently computed L. Exact bipartite matching plus monotone binary search evaluates every proposal.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
