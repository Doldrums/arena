# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 60
  max_retries: 2

prompt:
  system_message: |
    Smooth two-summand decomposition of a prescribed integer

    Return two positive integers a,b with a+b=123457. Minimize max(P(a),P(b)), where P is the largest prime factor and P(1)=1. The evaluator factors both integers independently. One fixed-target version of the small-prime-factor additive decomposition question; no universal bound for all large integers is asserted.

    Candidate interface: construct() -> candidate. Return two positive integers a,b with a+b=123457. Minimize max(P(a),P(b)), where P is the largest prime factor and P(1)=1. The evaluator factors both integers independently.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
