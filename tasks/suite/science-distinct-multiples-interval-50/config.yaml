# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Shortest interval above 50 containing distinct multiples of 1, ..., 50

    construct() -> integers b_1, ..., b_50 with 50 < b_i <= 5000, i | b_i and all b_i distinct. The score is max(b) - 50 + 1, the least k with every b_i in the open interval (50, 50 + k). Minimize; the optimum is 77. For n = 50 the optimum is 77, so the task recovers an optimal matching.

    Candidate interface: construct() -> integers b_1, ..., b_50 with 50 < b_i <= 5000, i | b_i and all b_i distinct. The score is max(b) - 50 + 1, the least k with every b_i in the open interval (50, 50 + k). Minimize; the optimum is 77.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
