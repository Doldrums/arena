# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Point sets without an empty convex hexagon (rediscovering 29 points)

    construct() -> list of 1..30 distinct integer points [x, y] with |x|, |y| <= 10^6 and no three collinear. No six points may form a convex hexagon with no other point inside (exact search over all convex chains anchored at their lowest vertex). Maximize the number of points; the optimum is 29. Overmars found 29-point sets without empty hexagons and Heule and Scheucher proved every 30-point set has one, so 29 is optimal.

    Candidate interface: construct() -> list of 1..30 distinct integer points [x, y] with |x|, |y| <= 10^6 and no three collinear. No six points may form a convex hexagon with no other point inside (exact search over all convex chains anchored at their lowest vertex). Maximize the number of points; the optimum is 29.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
