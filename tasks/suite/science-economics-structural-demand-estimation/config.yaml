# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 180
  max_retries: 2

prompt:
  system_message: |
    Economics: Structural differentiated-product demand estimation

    Structural differentiated-product demand estimation with an explicit candidate API, independently recomputed objective and fixed model/data assumptions.

    Candidate interface: estimate_demand(products, instrument_columns, model_spec, budget) -> sigma in[0,3] for a single random coefficient on horsepower/weight. Fixed linear controls 1,prices,hpwt,air,mpd,space; source BLP car data on two complete3-year market blocks. Fixed input-derived full-rank instrument span(QR removes exact redundancies),1-step GMM. Candidate9-point quadrature; independent15-point re-evaluation with1e-13 fixed-point tolerance. Minimize mean GMM objective per product, require share residual<1e-8. This is reduced structural-demand estimation, not full BLP replication.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
