# SCiEL / OpenEvolve configuration generated by scripts/build_suite.py
max_iterations: 100
checkpoint_interval: 10
parallel_evaluations: 1

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"
  models:
    - name: "google/gemini-2.5-flash"
      weight: 1.0
  temperature: 0.7
  max_tokens: 4000
  timeout: 120

database:
  population_size: 40
  num_islands: 3
  migration_interval: 20
  feature_dimensions:
    - "score"
    - "complexity"

evaluator:
  timeout: 120
  max_retries: 2

prompt:
  system_message: |
    Thirty-two integers with many distinct 3-term progression differences

    construct() -> exactly 32 distinct integers in 1..512. The score is the number of distinct d > 0 such that a, a + d, a + 2d all lie in the set for some a. Maximize. A 32-element set with many progression differences is a finite construction for this extremal function.

    Candidate interface: construct() -> exactly 32 distinct integers in 1..512. The score is the number of distinct d > 0 such that a, a + d, a + 2d all lie in the set for some a. Maximize.

    Only modify code between the EVOLVE-BLOCK markers; keep the interface unchanged.
  num_top_programs: 3
  num_diverse_programs: 2

log_level: "INFO"
